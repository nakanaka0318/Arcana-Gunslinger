<title>Arcana Online 運営室</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* ── トークン:運営コンソール風のダークHUD(単一テーマ) ── */
:root{
  --bg:#0e1317;
  --panel:rgba(17,22,28,.88);
  --panel-2:rgba(22,28,35,.97);
  --raise:#252e38;
  --line:rgba(228,220,198,.15);
  --ink:#ece6d6;
  --ink-dim:#a6a192;
  --accent:#e2a64b;
  --accent-ink:#1c1406;
  --edit:#5bb8d9;
  --good:#7cc98f;
  --warn:#e6c35a;
  --bad:#e36b5d;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  --tb-h:64px;
  --rail-w:64px;
  --panel-w:min(40vw,460px);
  --sheet-h:0px;
  --bb-h:0px;
  --log-h:44px;
  --mm-w:0px;
  --ff:'Zen Kaku Gothic New',system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
:root{padding:0!important}
[hidden]{display:none!important}
/* 連打によるダブルタップ拡大を無効化(個別に指定した要素はその指定が優先) */
html,body,*{touch-action:manipulation}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{position:fixed;inset:0;font:500 14px/1.45 var(--ff);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;min-width:44px;min-height:44px;
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums;font-weight:500}
.glass{background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* ── 上部バー ── */
#topbar{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;gap:6px;
  padding:calc(var(--sat) + 6px) calc(var(--sar) + 8px) 0 calc(var(--sal) + 8px);pointer-events:none}
#status{pointer-events:auto;display:flex;align-items:center;gap:14px;height:44px;padding:0 10px 0 12px;border-radius:12px;
  white-space:nowrap;overflow:hidden;text-align:left;cursor:pointer}
.st{display:flex;align-items:baseline;gap:5px;min-width:0}
.st i{font-style:normal;color:var(--ink-dim);font-size:14px}
.st b{font:600 15px var(--fm);font-variant-numeric:tabular-nums}
#status .chev{margin-left:auto;color:var(--ink-dim);width:18px;height:18px}
#status[aria-expanded="true"] .chev{transform:rotate(180deg)}
#row2{display:flex;align-items:center;gap:8px;pointer-events:none}
#speed{pointer-events:auto;display:flex;border-radius:12px;padding:0 2px;height:44px;align-items:center}
#speed button{min-width:44px;height:44px;display:grid;place-items:center;font:600 14px var(--fm);color:var(--ink-dim);position:relative}
#speed button span{display:grid;place-items:center;min-width:34px;height:28px;border-radius:8px;padding:0 4px}
#speed button.on span{background:var(--accent);color:var(--accent-ink)}
#speed button svg{width:16px;height:16px}
#mode{pointer-events:auto;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;min-width:0;text-align:left}
#mode .dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 3px rgba(124,201,143,.2)}
#mode .mtxt{display:flex;flex-direction:column;min-width:0;line-height:1.2}
#mode .lbl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mode .sub{display:none;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mode .x{display:none;width:22px;height:22px;stroke-width:2.4}
#mode.editing{background:var(--edit);border-color:var(--edit);color:#06202b;padding:0 12px 0 8px;box-shadow:0 0 0 3px rgba(91,184,217,.3)}
#mode.editing .dot{display:none}
#mode.editing .x,#mode.editing .sub{display:block}

#statusDetail{position:absolute;left:calc(var(--sal) + 8px);right:calc(var(--sar) + 8px);top:calc(var(--sat) + 56px);
  pointer-events:auto;border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;z-index:4}
#statusDetail div{display:flex;flex-direction:column}
#statusDetail i{font-style:normal;color:var(--ink-dim);font-size:14px}
#statusDetail b{font:600 16px var(--fm);font-variant-numeric:tabular-nums}

/* ── ツール(縦:タブバー / 横:レール) ── */
#tools{pointer-events:auto;position:absolute;left:0;right:0;bottom:0;height:calc(var(--tb-h) + var(--sab));
  padding:0 var(--sar) var(--sab) var(--sal);display:flex;overflow-x:auto;overflow-y:hidden;background:var(--panel-2);
  border-top:1px solid var(--line);touch-action:pan-x;scrollbar-width:none;z-index:3}
#tools::-webkit-scrollbar{display:none}
#tools button{flex:0 0 66px;height:var(--tb-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-dim);position:relative}
#tools button .lb{font-size:14px;line-height:1;white-space:nowrap}
#tools button.on{color:var(--accent)}
#tools button.on::after{content:"";position:absolute;top:0;left:14px;right:14px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
#tools button.locked{opacity:.4}
#railTip{position:absolute;pointer-events:none;padding:8px 12px;border-radius:9px;background:var(--raise);border:1px solid var(--line);
  font-weight:700;white-space:nowrap;z-index:9}

/* ── パネル(縦:ボトムシート / 横:右サイドパネル) ── */
#panel{pointer-events:auto;position:absolute;left:0;right:0;bottom:calc(var(--tb-h) + var(--sab));height:0;
  background:var(--panel-2);border-top:1px solid var(--line);border-radius:16px 16px 0 0;display:flex;flex-direction:column;
  overflow:hidden;visibility:hidden;transition:height .24s cubic-bezier(.2,.8,.2,1),visibility 0s .24s;z-index:2;
  box-shadow:0 -10px 30px rgba(0,0,0,.35)}
#panel.open{visibility:visible;transition:height .24s cubic-bezier(.2,.8,.2,1)}
#panel.dragging{transition:none}
#ph{flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 16px;height:56px;position:relative;touch-action:none;cursor:grab}
#ph::before{content:"";position:absolute;top:7px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:rgba(228,220,198,.3)}
#ph h2{margin:0;font-size:17px;font-weight:700;flex:1;padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ph button{display:grid;place-items:center;color:var(--ink-dim);margin-top:6px}
#pb{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px calc(20px + var(--sab));touch-action:pan-y;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:18px}

/* ── カメラボタン ── */
#camBtns{pointer-events:none;position:absolute;right:calc(var(--sar) + 8px);bottom:calc(var(--tb-h) + var(--sab) + var(--sheet-h) + 8px);transition:bottom .24s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;gap:10px;z-index:1}
#camBtns button{pointer-events:auto;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
#camBtns button.dim{color:var(--ink-dim);opacity:.55}
#camBtns button.act{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}

/* ── ログ ── */
#log{pointer-events:auto;position:absolute;left:calc(var(--sal) + 8px);right:calc(var(--sar) + 70px);
  bottom:calc(var(--tb-h) + var(--sab) + var(--sheet-h) + 8px);border-radius:10px;padding:0 12px;min-height:44px;
  display:flex;flex-direction:column;justify-content:center;cursor:pointer;transition:bottom .24s cubic-bezier(.2,.8,.2,1);z-index:1}
#log .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;line-height:1.5}
#log .ln .t{font:500 13px var(--fm);color:var(--ink-dim);margin-right:8px}
#log .ln.warn{color:var(--warn)}#log .ln.bad{color:var(--bad)}#log .ln.good{color:var(--good)}
#log.expanded{max-height:45vh;overflow-y:auto;padding:8px 12px;justify-content:flex-start;touch-action:pan-y}
#log.expanded .ln{white-space:normal}
body.sheet-full #log,body.sheet-full #selCard,body.sheet-full #camBtns{display:none}
body.portrait.panel-open #btnFull{display:none}

/* ── 選択カード ── */
#selCard{pointer-events:auto;position:absolute;left:calc(var(--sal) + 8px);right:calc(var(--sar) + 70px);
  bottom:calc(var(--tb-h) + var(--sab) + var(--sheet-h) + 60px);border-radius:12px;padding:10px 6px 8px 14px;z-index:1;
  transition:bottom .24s cubic-bezier(.2,.8,.2,1)}
#selCard .hd{display:flex;align-items:center;gap:8px}
#selCard h3{margin:0;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#selCard .kind{font-size:14px;color:var(--accent);white-space:nowrap}
#selCard dl{margin:4px 8px 6px 0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
#selCard dt{color:var(--ink-dim)}#selCard dd{margin:0;font-family:var(--fm);font-variant-numeric:tabular-nums;text-align:right}
#selCard .acts{display:flex;gap:8px;flex-wrap:wrap;padding-right:8px}

/* ── トースト / FPS / ダイアログ ── */
#toasts{position:absolute;left:50%;top:calc(var(--sat) + 108px);transform:translateX(-50%);display:flex;flex-direction:column;
  align-items:center;gap:6px;pointer-events:none;width:min(92vw,420px);z-index:6}
.toast{background:var(--raise);border:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 14px;border-radius:10px;
  font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .25s ease-out;max-width:100%}
.toast.warn{border-left-color:var(--warn)}.toast.bad{border-left-color:var(--bad)}.toast.good{border-left-color:var(--good)}
.toast.out{opacity:0;transform:translateY(-6px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#fps{position:absolute;left:calc(var(--sal) + 8px);top:calc(var(--sat) + 108px);padding:4px 8px;border-radius:8px;
  font:600 14px var(--fm);pointer-events:none;z-index:1}
#dialog{position:absolute;inset:0;background:rgba(5,8,10,.55);display:grid;place-items:center;pointer-events:auto;z-index:20;padding:16px}
#dialog .box{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(100%,380px);
  display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
#dialog p{margin:0;line-height:1.6}
#dialog .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#bootErr{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;z-index:30;background:var(--bg)}

/* ── パネル内部の部品 ── */
.sec{display:flex;flex-direction:column;gap:10px}
.sec h4{margin:0;font-size:14px;letter-spacing:.06em;color:var(--ink-dim);font-weight:700}
.row{display:flex;align-items:center;gap:12px;min-height:44px}
.row .grow{flex:1;min-width:0}
.hint{color:var(--ink-dim);font-size:14px;margin:0;line-height:1.6}
.btn{min-height:44px;padding:0 16px;border-radius:10px;background:var(--raise);border:1px solid var(--line);font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{min-height:40px;padding:0 12px}
.seg{display:flex;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border-radius:8px;font-weight:700;color:var(--ink-dim)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.sw{width:56px;height:44px;min-width:56px;display:grid;place-items:center}
.sw::before{content:"";width:48px;height:28px;border-radius:14px;background:var(--raise);border:1px solid var(--line);grid-area:1/1;transition:.2s}
.sw::after{content:"";width:22px;height:22px;border-radius:50%;background:var(--ink-dim);grid-area:1/1;transform:translateX(-10px);transition:.2s}
.sw[aria-checked="true"]::before{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{background:var(--accent-ink);transform:translateX(10px)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.card{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.card i{font-style:normal;color:var(--ink-dim);font-size:14px}
.card b{font:600 18px var(--fm);font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.keys dt{font:600 14px var(--fm);color:var(--accent);white-space:nowrap}
.keys dd{margin:0}
.plan{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;line-height:1.55}
.stage{display:inline-block;font:600 13px var(--fm);color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:1px 7px;margin-right:6px}

/* ── 地形ブラシバー ── */
.ebar{pointer-events:auto;position:absolute;left:0;right:0;bottom:calc(var(--tb-h) + var(--sab));background:var(--panel-2);
  border-top:2px solid var(--edit);border-radius:14px 14px 0 0;padding:8px calc(var(--sar) + 12px) 4px calc(var(--sal) + 12px);
  display:flex;flex-direction:column;gap:6px;z-index:2;box-shadow:0 -8px 24px rgba(0,0,0,.3)}
.bb-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;align-items:center}
.bb-row::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  font-weight:700;display:inline-flex;align-items:center;gap:7px;color:var(--ink-dim);white-space:nowrap}
.chip.on{background:var(--edit);border-color:var(--edit);color:#06202b}
.chip[disabled]{opacity:.35;cursor:default}
.chip .sw8{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.35);flex:none}
.chip.undo{margin-left:auto;padding:0 11px}
.chip.undo svg{width:20px;height:20px}
body.portrait .chip.undo .lb{display:none}
body.portrait #bbTools .chip{padding:0 11px}
.bb-sl{display:grid;grid-template-columns:1fr;gap:0 18px}
.sl{display:flex;align-items:center;gap:10px;min-height:44px}
.sl .k{color:var(--ink-dim);flex:none;min-width:2.3em}
.sl output{font:600 14px var(--fm);font-variant-numeric:tabular-nums;min-width:3.6em;text-align:right;flex:none}
.sl.off{opacity:.4}
input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:44px;margin:0;background:transparent;touch-action:manipulation;cursor:pointer}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--raise);border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--edit);margin-top:-12px;border:3px solid #0e1317}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--raise)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--edit);border:3px solid #0e1317}
.tools5{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tools5 .chip{justify-content:center;min-height:52px}

.pl-hd{display:flex;align-items:baseline;gap:10px}
.pl-hd b{font-size:15px}
.pl-hd .num{color:var(--accent);margin-left:auto;font-size:14px}
.pl-st{margin:0;font-size:14px;color:var(--ink-dim);min-height:1.45em}
.pl-st.bad{color:var(--bad);font-weight:700}
.pl-acts .sp{flex:1}
.pl-acts .btn{flex:none}
.ar-form{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ar-form .txt{flex:1 1 140px}
.mini-stp{display:flex;align-items:center;gap:4px}
.mini-stp span{color:var(--ink-dim)}
.mini-stp output{min-width:1.8em;text-align:center;font:600 15px var(--fm)}
.btn.edit{background:var(--edit);border-color:var(--edit);color:#06202b}
.btn[disabled]{opacity:.4;cursor:default}
.bb-row.wrap{flex-wrap:wrap;overflow:visible}
.plgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.plc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.035)}
.plc b{font-size:15px}
.plc .num{color:var(--accent);font-size:14px}
.plc .d{color:var(--ink-dim);font-size:14px;line-height:1.45}
.ecard{background:rgba(255,255,255,.035);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ecard .hd{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.meta{color:var(--ink-dim);font-size:14px;margin:0}
.txt{font:inherit;font-size:16px;color:var(--ink);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:9px;min-height:44px;padding:0 12px;width:100%;min-width:0;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.txt:focus{outline:2px solid var(--accent);outline-offset:1px}
.fld{display:flex;flex-direction:column}
.fl-hd{display:flex;justify-content:space-between;align-items:baseline}
.fl-hd span{color:var(--ink-dim)}
.fl-hd output{font:600 14px var(--fm);font-variant-numeric:tabular-nums}
.stp{display:flex;align-items:center;gap:6px}
.sb{width:44px;height:44px;border-radius:10px;background:var(--raise);border:1px solid var(--line);font:700 20px var(--fm);flex:none;display:grid;place-items:center}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swc{width:44px;height:44px;border-radius:10px;border:3px solid transparent}
.swc.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--bg)}
.mcard{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.035);width:100%}
.mcard .dot{width:28px;height:28px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.35)}
.mcard .t{flex:1;min-width:0;display:flex;flex-direction:column}
.mcard svg{color:var(--ink-dim)}
.popbar{position:relative;height:24px;border-radius:6px;background:rgba(0,0,0,.3);overflow:hidden}
.popbar i{position:absolute;left:0;top:0;bottom:0;opacity:.5}
.popbar span{position:relative;font-size:14px;padding-left:8px;line-height:24px;font-weight:700}
.cdot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}
.bad{color:var(--bad)}
.hint.bad{color:var(--bad)}
.btn.danger{background:rgba(227,107,93,.18);border-color:var(--bad);color:#ffb3a9}
.row.wrapbtn{flex-wrap:wrap;gap:8px}
.txtarea{font:500 13px/1.4 var(--fm);color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:9px;width:100%;box-sizing:border-box;min-height:120px;padding:10px;resize:vertical;-webkit-user-select:text;user-select:text;word-break:break-all}
.txtarea:focus{outline:2px solid var(--accent)}
.rcard{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}

<script>
(() => {
'use strict';
// 拡大禁止の viewport を head の設定にも反映する
(() => {
  const c = 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
  let m = document.head && document.head.querySelector('meta[name="viewport"]');
  if (!m && document.head) { m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
  document.querySelectorAll('meta[name="viewport"]').forEach(x => x.setAttribute('content', c));
})();
if (!window.THREE) { document.getElementById('bootErr').hidden = false; return; }

/* ════════════════════════════════════════════
   基本ユーティリティ
   ════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const DEG = Math.PI / 180;
const fmt = n => Math.round(n).toLocaleString('ja-JP');
const pad2 = n => String(n).padStart(2, '0');

function hash2(x, y, s) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi, s), hash2(xi + 1, yi, s), u), lerp(hash2(xi, yi + 1, s), hash2(xi + 1, yi + 1, s), u), v);
}
function fbm(x, y, s, oct = 4) {
  let v = 0, a = .5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { v += a * vnoise(x * f, y * f, s + i * 17); n += a; a *= .5; f *= 2; }
  return v / n;
}

/* ════════════════════════════════════════════
   定数・画質設定
   ════════════════════════════════════════════ */
const WORLD = 256, HALF = WORLD / 2, DN = 129, CELL = WORLD / (DN - 1), SEA_FLOOR = -14;
const TOWN0 = { x: 0, z: 14 };
const IS_MOBILE = matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const TARGET_FPS = IS_MOBILE ? 30 : 60;
const QUALITY = {
  low:  { label: '低', pr: 1,   shadow: false, res: 64,  npc: 100, fog: 170 },
  mid:  { label: '中', pr: 1.5, shadow: false, res: 96,  npc: 200, fog: 300 },
  high: { label: '高', pr: 2,   shadow: true,  res: 128, npc: 300, fog: 440 },
};
const Q_ORDER = ['low', 'mid', 'high'];
function autoQuality() {
  const cores = navigator.hardwareConcurrency || 4, mem = navigator.deviceMemory || 4;
  if (IS_MOBILE) return (mem <= 2 || cores <= 2) ? 'low' : 'mid';
  return (cores <= 4 || mem <= 4 || (devicePixelRatio || 1) > 2.5) ? 'mid' : 'high';
}
const SPEEDS = [0, 1, 4, 16];

/* ════════════════════════════════════════════
   ゲーム状態
   ════════════════════════════════════════════ */
const TT_NAMES = ['草原', '森', '砂漠', '雪原', '沼地'];
let G = null;

function newGame(seed) {
  const g = {
    version: 1, seed, day: 1, hour: 8,
    money: 10000, subscribers: 20, satisfaction: 70, research: 0,
    terrain: { n: DN, h: new Float32Array(DN * DN), t: new Uint8Array(DN * DN) },
    objects: [], areas: [], monsterTypes: [], monsters: [], classes: [], players: [], nextId: 1, logs: [],
    quests: [], items: [], unlocked: [], gms: 0, hist: [], today: newToday(), negDays: 0, goalReached: false, model: 'sub',
    requests: [], effects: { outage: 0, rival: 0, buzz: 0 }, stats: { bans: 0, warns: 0, rescues: 0 },
  };
  generateIsland(g);

function generateIsland(g) {
  const H = g.terrain.h, T = g.terrain.t, s = g.seed;
  for (let iz = 0; iz < DN; iz++) for (let ix = 0; ix < DN; ix++) {
    const x = -HALF + ix * CELL, z = -HALF + iz * CELL, nx = x / HALF, nz = z / HALF, i = iz * DN + ix;
    const d = Math.hypot(nx * 1.05, nz) + (fbm(x * .012, z * .012, s) - .5) * .5;
    const island = 1 - smooth(.44, .95, d);
    let h = -13 + island * 16;
    h += island * (fbm(x * .04, z * .04, s + 5) - .5) * 9;
    const m = Math.max(0, fbm(x * .02 + 40, z * .02, s + 9) - .44) * 2.6;
    const north = smooth(.2, -.4, nz);
    h += island * island * m * 70 * (.25 + .75 * north);
    const td = Math.hypot(x - TOWN0.x, z - TOWN0.z);
    h = lerp(h, 2.6, smooth(26, 12, td));
    H[i] = clamp(h, SEA_FLOOR, 48);
    let t = 0;
    if (td > 28 && H[i] > 1.2 && H[i] < 20 && fbm(x * .035 + 200, z * .035, s + 23) > .56) t = 1;
    else if (td > 28 && H[i] > .3 && H[i] < 2.4 && fbm(x * .05 + 300, z * .05, s + 31) > .64) t = 4;
    T[i] = t;
  }
}

function heightAt(x, z) {
  const gx = (x + HALF) / CELL, gz = (z + HALF) / CELL;
  if (gx < 0 || gz < 0 || gx > DN - 1 || gz > DN - 1) return SEA_FLOOR;
  const ix = Math.min(DN - 2, gx | 0), iz = Math.min(DN - 2, gz | 0), fx = gx - ix, fz = gz - iz;
  const H = G.terrain.h, i = iz * DN + ix;
  return lerp(lerp(H[i], H[i + 1], fx), lerp(H[i + DN], H[i + DN + 1], fx), fz);
}
function slopeAt(x, z) {
  const dx = (heightAt(x + 1, z) - heightAt(x - 1, z)) / 2, dz = (heightAt(x, z + 1) - heightAt(x, z - 1)) / 2;
  return Math.hypot(dx, dz);
}
function typeAt(x, z) {
  const ix = clamp(Math.round((x + HALF) / CELL), 0, DN - 1), iz = clamp(Math.round((z + HALF) / CELL), 0, DN - 1);
  return G.terrain.t[iz * DN + ix];
}

const COL = {

  grass: new THREE.Color(0x6a9a43), dirt: new THREE.Color(0x8b7250), rock: new THREE.Color(0x7b766d), snow: new THREE.Color(0xeef2f5),

const Terrain = {
  mesh: null, geo: null, res: 0,
  build(res) {

    geo.rotateX(-Math.PI / 2);
    geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(res * res * 3), 3));
    this.geo = geo;
    this.mesh = new THREE.Mesh(geo, MAT.terrain);
    this.mesh.receiveShadow = true;
    scene.add(this.mesh);
    this.refresh();
  },
  // 範囲指定(ワールド座標)で頂点の高さと色を更新。normals=false で法線再計算を間引く
  range(x0, z0, x1, z1) {
    const n = this.res, step = WORLD / (n - 1);

      clamp(Math.floor((z0 + HALF) / step) - 1, 0, n - 1), clamp(Math.ceil((z1 + HALF) / step) + 1, 0, n - 1)];
  },
  refresh(x0 = -HALF, z0 = -HALF, x1 = HALF, z1 = HALF, normals = true) {
    const n = this.res;
    const pos = this.geo.attributes.position.array, col = this.geo.attributes.color.array;
    const [i0, i1, j0, j1] = this.range(x0, z0, x1, z1);
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const k = j * n + i, x = pos[k * 3], z = pos[k * 3 + 2];
      const h = heightAt(x, z);
      pos[k * 3 + 1] = h;
      terrainColor(h, typeAt(x, z), slopeAt(x, z), hash2(i, j, 99), _c);
      col[k * 3] = _c.r; col[k * 3 + 1] = _c.g; col[k * 3 + 2] = _c.b;
    }

    this.geo.attributes.color.needsUpdate = true;
    if (normals) this.normals(x0, z0, x1, z1);
  },
  // 高さマップの勾配から範囲内の法線を再計算(メッシュ全体の computeVertexNormals より軽い)
  normals(x0 = -HALF, z0 = -HALF, x1 = HALF, z1 = HALF) {
    const n = this.res, s = WORLD / (n - 1);

    const [i0, i1, j0, j1] = this.range(x0, z0, x1, z1);
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const k = (j * n + i) * 3, x = pos[k], z = pos[k + 2];
      const nx = heightAt(x - s, z) - heightAt(x + s, z), ny = 2 * s, nz = heightAt(x, z - s) - heightAt(x, z + s);
      const l = Math.hypot(nx, ny, nz);
      nor[k] = nx / l; nor[k + 1] = ny / l; nor[k + 2] = nz / l;
    }
    this.geo.attributes.normal.needsUpdate = true;

  },
};

const Scenery = {
  max: 5000, trunks: null, canopies: null,
  init() {
    this.trunks = new THREE.InstancedMesh(GEO.trunk, MAT.trunk, this.max);
    this.canopies = new THREE.InstancedMesh(GEO.canopy, MAT.canopy, this.max);
    for (const m of [this.trunks, this.canopies]) { m.castShadow = true; m.receiveShadow = true; scene.add(m); }
    this.rebuild();
  },
  rebuild() {
    const T = G.terrain.t, s = G.seed, o = new THREE.Object3D(), c = new THREE.Color();
    let n = 0;
    for (let iz = 0; iz < DN && n < this.max; iz++) for (let ix = 0; ix < DN && n < this.max; ix++) {
      const t = T[iz * DN + ix], r = hash2(ix, iz, s + 7);
      const want = t === 1 ? r < .5 : t === 0 ? r < .012 : t === 4 ? r < .05 : false;
      if (!want) continue;
      const x = -HALF + ix * CELL + (hash2(ix, iz, s + 8) - .5) * CELL, z = -HALF + iz * CELL + (hash2(ix, iz, s + 9) - .5) * CELL;
      const h = heightAt(x, z);
      if (h < .7 || slopeAt(x, z) > 1.0 || blockedAt(x, z)) continue;

      o.position.set(x, h - .1, z); o.rotation.set(0, r * 40, 0); o.scale.set(sc, sc * (t === 4 ? .7 : 1), sc);

      c.setHSL(.27 + hash2(ix, iz, s + 11) * .07, .45, (t === 4 ? .22 : .25) + hash2(ix, iz, s + 12) * .08);
      this.canopies.setColorAt(n, c);
      n++;
    }
    this.trunks.count = this.canopies.count = n;
    this.trunks.instanceMatrix.needsUpdate = this.canopies.instanceMatrix.needsUpdate = true;
    if (this.canopies.instanceColor) this.canopies.instanceColor.needsUpdate = true;
  },
};

  const a = b.dataset.ar, A = AreaEdit;
  if (a === 'cancel') { if (A.p0) { A.clear(); renderAreaBar(); } else setMode('view'); }
  else if (a === 'redo') { A.clear(); renderAreaBar(); }
  else if (a === 'ok') A.confirm();
  else {
    if (a === 'min-') A.lvMin = Math.max(1, A.lvMin - 1);
    if (a === 'min+') { A.lvMin = Math.min(50, A.lvMin + 1); A.lvMax = Math.max(A.lvMax, A.lvMin); }
    if (a === 'max-') { A.lvMax = Math.max(1, A.lvMax - 1); A.lvMin = Math.min(A.lvMin, A.lvMax); }
    if (a === 'max+') A.lvMax = Math.min(50, A.lvMax + 1);
    $('#arMin').textContent = A.lvMin; $('#arMax').textContent = A.lvMax;
  }
});
$('#areaBar').addEventListener('input', e => { if (e.target.id === 'arName') AreaEdit.name = e.target.value; });

   クラス(職業)
   ════════════════════════════════════════════ */
const WEAPONS = [['sword', '剣'], ['staff', '杖'], ['bow', '弓'], ['axe', '斧'], ['dagger', '短剣']];
const WEAPON_RANGE = { sword: 1.3, staff: 6, bow: 7, axe: 1.3, dagger: 1.1 };
const CLASS_COLORS = ['#d9534a', '#4a7fd9', '#4fae5a', '#c27f35', '#8e5bc4', '#e2c04a', '#3fb7b0', '#e07cae', '#dcdcd0', '#4a4f5c'];
const DEFAULT_CLASSES = [
  { name: '剣士', color: '#d9534a', weapon: 'sword', hp: 120, atk: 14, def: 6, spd: 5, gHp: 14, gAtk: 2.2, gDef: 1.2, skills: [{ name: '強打', mult: 1.8, cd: 4 }, { name: '回転斬り', mult: 2.6, cd: 9 }] },
  { name: '魔法使い', color: '#4a7fd9', weapon: 'staff', hp: 80, atk: 19, def: 3, spd: 4.5, gHp: 9, gAtk: 3, gDef: .6, skills: [{ name: 'ファイア', mult: 2.2, cd: 5 }, { name: 'メテオ', mult: 4, cd: 14 }] },
  { name: '弓使い', color: '#4fae5a', weapon: 'bow', hp: 95, atk: 16, def: 4, spd: 6, gHp: 11, gAtk: 2.5, gDef: .8, skills: [{ name: '狙い撃ち', mult: 2, cd: 5 }, { name: '連射', mult: 3, cd: 11 }] },
  { name: '重戦士', color: '#c27f35', weapon: 'axe', hp: 160, atk: 11, def: 10, spd: 4, gHp: 18, gAtk: 1.6, gDef: 2, skills: [{ name: '盾打ち', mult: 1.5, cd: 3 }, { name: '大地割り', mult: 3.2, cd: 12 }] },
];
function newClass(id, o = {}) {
  const c = Object.assign({ id, name: '新しいクラス', color: '#dcdcd0', weapon: 'sword', hp: 100, atk: 14, def: 5, spd: 5, gHp: 12, gAtk: 2, gDef: 1, pop: 50, kills: 0, killTime: 0 }, o);
  c.skills = (o.skills || [{ name: 'スキル1', mult: 1.8, cd: 5 }, { name: 'スキル2', mult: 3, cd: 12 }]).map(s => ({ ...s }));
  c.basePower = classPower(c);
  return c;
}
// Lv10時点の耐久×火力を強さの目安にする(バフ/ナーフの判定用)
function classPower(c) {
  const L = 9, hp = c.hp + c.gHp * L, atk = c.atk + c.gAtk * L, def = c.def + c.gDef * L;
  const sk = c.skills.reduce((a, s) => a + (s.mult - 1) / Math.max(1, s.cd), 0);
  return hp * (1 + def * .03) * atk * (1 + sk) * Math.pow(c.spd / 5, .3) / 1000;
}
const expNeed = lv => Math.round(100 * Math.pow(lv, 1.5));
const calcDmg = (atk, def) => Math.max(1, Math.round(atk * (.8 + Math.random() * .4) - def));
const Classes = {
  byId(id) { return G.classes.find(c => c.id === id); },
  avgPower() { return G.classes.reduce((a, c) => a + classPower(c), 0) / Math.max(1, G.classes.length); },
  stats(c) {
    let n = 0, lv = 0, sat = 0;
    for (const p of G.players) if (p.cls === c.id) { n++; lv += p.lv; sat += p.sat; }
    return { n, avgLv: n ? lv / n : 0, sat: n ? sat / n : 0, kill: c.kills ? c.killTime / c.kills : 0 };
  },
  updatePopularity() {
    const avg = this.avgPower();
    for (const c of G.classes) {
      const s = this.stats(c);
      const target = clamp(50 + (classPower(c) / avg - 1) * 60 + ((s.n ? s.sat : 60) - 60) * .6, 5, 100);
      c.pop = Math.round(lerp(c.pop ?? 50, target, .5));
    }
  },
  timers: new Map(),
  scheduleCheck(c) {
    clearTimeout(this.timers.get(c.id));
    this.timers.set(c.id, setTimeout(() => this.checkBalance(c), 900));
  },
  // 大幅なナーフはそのクラスの加入者の満足度を下げる(バフは少し上げる)。
  // 比較の基準はその日の開始時点の強さ(小刻みなナーフも1日の合計で判定する)
  checkBalance(c) {
    if (!G.classes.includes(c)) return;
    const pw = classPower(c), d = pw / (c.basePower || pw) - 1;
    const members = G.players.filter(p => p.cls === c.id);
    if (d < -.15) {
      const loss = Math.min(20, -d * 40);
      for (const p of members) p.sat = Math.max(0, p.sat - loss);
      log(`${c.name}の大幅な弱体化で、${members.length}人の満足度が${loss.toFixed(0)}下がりました`, 'warn');
      toast(`${c.name}の大幅ナーフに不満の声(満足度−${loss.toFixed(0)})`, 'warn');
    } else if (d > .15) {
      const gain = Math.min(5, d * 10);
      for (const p of members) p.sat = Math.min(100, p.sat + gain);
      log(`${c.name}の強化で、${members.length}人の満足度が${gain.toFixed(0)}上がりました`, 'good');
    }
    if (Math.abs(d) > .15) c.basePower = pw;
    this.updatePopularity();
    if (UI.tab === 'class') { const el = document.getElementById('clPower'); if (el) el.textContent = powerText(c); }
  },
};
function powerText(c) { return `平均比 ${Math.round(classPower(c) / Classes.avgPower() * 100)}%`; }

/* ════════════════════════════════════════════
   経路探索(4mグリッドのA*、経路はキャッシュ)
   ════════════════════════════════════════════ */
const PG = {
  N: 64, C: 4, dirty: true,
  walk: new Uint8Array(4096), road: new Uint8Array(4096), deck: new Float32Array(4096), comp: new Int32Array(4096),
  cache: new Map(), queue: [],
  g: new Float32Array(4096), came: new Int32Array(4096), stamp: new Int32Array(4096), closed: new Int32Array(4096), gen: 0,
  hI: new Int32Array(40000), hF: new Float32Array(40000), hn: 0,
  idx(x, z) { return clamp(Math.floor((z + HALF) / 4), 0, 63) * 64 + clamp(Math.floor((x + HALF) / 4), 0, 63); },
  cx(i) { return -HALF + (i % 64) * 4 + 2; },
  cz(i) { return -HALF + Math.floor(i / 64) * 4 + 2; },
  ensure() { if (this.dirty) this.rebuild(); },
  rebuild() {
    const W = this.walk, Rd = this.road, D = this.deck;
    for (let i = 0; i < 4096; i++) {
      const x = this.cx(i), z = this.cz(i), h = heightAt(x, z);
      W[i] = h >= .2 && slopeAt(x, z) <= .95 && Math.abs(x) < HALF - 3 && Math.abs(z) < HALF - 3 ? 1 : 0;
      Rd[i] = 0; D[i] = -99;
    }
    // 道路・橋のセルを線分に沿って塗る(橋の上は水上でも通れる)
    for (const o of G.objects) {
      if (o.type !== 'road' && o.type !== 'bridge') continue;
      const deckY = o.type === 'bridge' ? bridgeDeckY(o.x0, o.z0, o.x1, o.z1) : 0;
      for (const [x, z] of sampleLine(o.x0, o.z0, o.x1, o.z1, 1)) {
        const i = this.idx(x, z);
        Rd[i] = 1;
        if (o.type === 'bridge') { W[i] = 1; D[i] = deckY; }
      }
    }
    // 連結成分(到達できるかの即時判定用)
    const C = this.comp; C.fill(0);
    let label = 0; const stack = [];
    for (let s = 0; s < 4096; s++) {
      if (!W[s] || C[s]) continue;
      C[s] = ++label; stack.push(s);
      while (stack.length) {
        const c = stack.pop(), ci = c % 64, cj = (c / 64) | 0;
        for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
          if (!di && !dj) continue;
          const ni = ci + di, nj = cj + dj; if (ni < 0 || nj < 0 || ni > 63 || nj > 63) continue;
          const n = nj * 64 + ni;
          if (!W[n] || C[n]) continue;
          if (di && dj && (!W[cj * 64 + ni] || !W[nj * 64 + ci])) continue;
          C[n] = label; stack.push(n);
        }
      }
    }
    this.cache.clear(); this.dirty = false;
  },
  nearestWalkable(i) {
    this.ensure();
    if (this.walk[i]) return i;
    const ci = i % 64, cj = (i / 64) | 0;
    for (let r = 1; r <= 3; r++) for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) {
      const ni = ci + di, nj = cj + dj; if (ni < 0 || nj < 0 || ni > 63 || nj > 63) continue;
      if (this.walk[nj * 64 + ni]) return nj * 64 + ni;
    }
    return -1;
  },
  compAt(x, z) { const i = this.nearestWalkable(this.idx(x, z)); return i < 0 ? 0 : this.comp[i]; },
  walkAt(x, z) { this.ensure(); return this.walk[this.idx(x, z)] === 1; },
  roadAt(x, z) { return this.road[this.idx(x, z)] === 1; },
  groundY(x, z) { const h = heightAt(x, z), d = this.deck[this.idx(x, z)]; return h < .2 && d > -99 ? d + .2 : Math.max(h, 0); },
  push(i, f) {
    let k = this.hn++; const I = this.hI, F = this.hF;
    while (k > 0) { const p = (k - 1) >> 1; if (F[p] <= f) break; I[k] = I[p]; F[k] = F[p]; k = p; }
    I[k] = i; F[k] = f;
  },
  pop() {
    const I = this.hI, F = this.hF, top = I[0], n = --this.hn, li = I[n], lf = F[n];
    let k = 0;
    while (true) { let c = 2 * k + 1; if (c >= n) break; if (c + 1 < n && F[c + 1] < F[c]) c++; if (F[c] >= lf) break; I[k] = I[c]; F[k] = F[c]; k = c; }
    I[k] = li; F[k] = lf;
    return top;
  },
  astar(s, t) {
    const W = this.walk, Rd = this.road, G2 = this.g, st = this.stamp, cl = this.closed, came = this.came;
    const gen = ++this.gen, ti = t % 64, tj = (t / 64) | 0;
    const h = i => { const dx = Math.abs(i % 64 - ti), dz = Math.abs(((i / 64) | 0) - tj); return (dx + dz + (1.414 - 2) * Math.min(dx, dz)) * .66; };
    this.hn = 0; G2[s] = 0; st[s] = gen; came[s] = -1; this.push(s, h(s));
    while (this.hn) {
      const c = this.pop();
      if (c === t) break;
      if (cl[c] === gen) continue;
      cl[c] = gen;
      const ci = c % 64, cj = (c / 64) | 0;
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        if (!di && !dj) continue;
        const ni = ci + di, nj = cj + dj; if (ni < 0 || nj < 0 || ni > 63 || nj > 63) continue;
        const n = nj * 64 + ni;
        if (!W[n] || cl[n] === gen) continue;
        if (di && dj && (!W[cj * 64 + ni] || !W[nj * 64 + ci])) continue;
        const ng = G2[c] + (di && dj ? 1.414 : 1) * (Rd[n] ? .66 : 1);
        if (st[n] !== gen || ng < G2[n]) { st[n] = gen; G2[n] = ng; came[n] = c; if (this.hn < 39990) this.push(n, ng + h(n)); }
      }
    }
    if (st[t] !== gen) return null;
    const cells = []; for (let c = t; c !== -1; c = came[c]) cells.push(c);
    cells.reverse();
    // 見通しの良い区間を間引いて滑らかにする
    const pts = cells.map(c => [this.cx(c), this.cz(c)]), out = [];
    let a = 0;
    while (a < pts.length - 1) {
      let b = pts.length - 1;
      while (b > a + 1 && !this.los(pts[a], pts[b])) b--;
      out.push(pts[b]); a = b;
    }
    return out;
  },
  los(a, b) {
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.ceil(L / 1.5);
    let onRoadAll = true;
    for (let k = 1; k < n; k++) {
      const x = lerp(a[0], b[0], k / n), z = lerp(a[1], b[1], k / n), i = this.idx(x, z);
      if (!this.walk[i]) return false;
      if (!this.road[i]) onRoadAll = false;
    }
    // 道路から外れる近道はしない(道路の速度ボーナスを活かす)
    return onRoadAll || !(this.road[this.idx(a[0], a[1])] && this.road[this.idx(b[0], b[1])]) || L < 8;
  },
  // 経路要求。キャッシュにあれば即時、なければ待ち行列へ(1ティック最大20件)
  request(p) {
    this.ensure();
    const s = this.nearestWalkable(this.idx(p.x, p.z)), t = this.nearestWalkable(this.idx(p.dest.x, p.dest.z));
    if (s < 0 || t < 0 || this.comp[s] !== this.comp[t]) { Players.pathFail(p); return; }
    if (s === t) { Players.setPath(p, []); return; }
    const c = this.cache.get(s * 4096 + t);
    if (c) { Players.setPath(p, c); return; }
    p.st = 'waitpath';
    if (!p.queued) { p.queued = true; this.queue.push(p.id); }
  },
  processQueue() {
    this.ensure();
    let n = 0;
    while (n < 20 && this.queue.length) {
      const p = Players.map.get(this.queue.shift());
      if (!p) continue;
      p.queued = false;
      if (p.st !== 'waitpath' || !p.dest) continue;
      const s = this.nearestWalkable(this.idx(p.x, p.z)), t = this.nearestWalkable(this.idx(p.dest.x, p.dest.z));
      n++;
      if (s < 0 || t < 0) { Players.pathFail(p); continue; }
      const key = s * 4096 + t;
      let path = this.cache.get(key);
      if (!path) {
        path = this.astar(s, t);
        if (path) { this.cache.set(key, path); if (this.cache.size > 800) this.cache.delete(this.cache.keys().next().value); }
      }
      if (path) Players.setPath(p, path); else Players.pathFail(p);
    }
  },
};

/* ════════════════════════════════════════════
   AI加入者
   ════════════════════════════════════════════ */
const NAME_A = ['アル', 'ベル', 'カイ', 'ミ', 'リ', 'ソラ', 'ユ', 'ハル', 'ナギ', 'レイ', 'ルナ', 'ジン', 'セツ', 'トモ', 'シオ', 'カナ', 'ロイ', 'エマ', 'ノア', 'ヒナ', 'タク', 'ユウ', 'レン', 'サク', 'メイ', 'リオ', 'ケン', 'アヤ', 'クロ', 'シロ'];
const NAME_B = ['ト', 'ナ', 'ン', 'ヤ', 'ス', 'リ', 'ラ', 'ル', 'マ', 'キ', '', 'ア', 'ロ', 'ノ'];
const pick = a => a[Math.floor(Math.random() * a.length)];
function genName() { let n = pick(NAME_A) + pick(NAME_B); if (Math.random() < .35) n += Math.floor(Math.random() * 99 + 1); return n; }
const ST_LABEL = { gather: '素材を収集中', dungeon: 'ダンジョン攻略中', idle: '町で待機', waitpath: '経路を探索中', travel: '狩り場へ移動中', hunt: '獲物を探索中', fight: '戦闘中', return: '町へ帰還中', lost: '迷子(道が見つからない)' };

function iconTexture(kind) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const c = cv.getContext('2d');
  const bg = { fight: '#e0574a', quest: '#e2c04a', sad: '#7a4fb0', lost: '#3f8fd6' }[kind];
  c.beginPath(); c.arc(32, 32, 28, 0, Math.PI * 2); c.fillStyle = bg; c.fill();
  c.lineWidth = 4; c.strokeStyle = '#1b1b1b'; c.stroke();
  c.strokeStyle = c.fillStyle = kind === 'quest' ? '#1c1406' : '#ffffff'; c.lineCap = 'round';
  if (kind === 'fight') { c.lineWidth = 6; c.beginPath(); c.moveTo(18, 18); c.lineTo(46, 46); c.moveTo(46, 18); c.lineTo(18, 46); c.stroke(); }
  else if (kind === 'sad') { c.lineWidth = 5; c.beginPath(); c.arc(32, 48, 12, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); c.beginPath(); c.arc(23, 26, 4, 0, 7); c.arc(41, 26, 4, 0, 7); c.fill(); }
  else { c.font = '900 42px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(kind === 'quest' ? '!' : '?', 32, 35); }
  const t = new THREE.CanvasTexture(cv); return t;
}

const Players = {
  map: new Map(), visList: [], crowd: new Map(), simT: 0, time: 0, followId: 0, _o: new THREE.Object3D(), _c: new THREE.Color(),
  cells: Array.from({ length: 32 * 32 }, () => []),
  init() {
    const B = GEO.box, cap = 300;
    const body = mergeParts([[B, M4(.11, .3, 0, .17, .6, .2)], [B, M4(-.11, .3, 0, .17, .6, .2)], [B, M4(0, .9, 0, .46, .58, .3)], [B, M4(.31, .92, 0, .13, .52, .15)], [B, M4(-.31, .92, 0, .13, .52, .15)]]);
    const head = mergeParts([[new THREE.SphereGeometry(.19, 10, 8), M4(0, 1.4, 0)], [B, M4(0, 1.5, -.03, .36, .14, .34)]]);
    const cyl = new THREE.CylinderGeometry(.5, .5, 1, 6);
    const R = (x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0) => new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new THREE.Vector3(sx, sy, sz));
    const wg = {
      sword: mergeParts([[B, M4(0, .52, 0, .07, .8, .14)], [B, M4(0, .1, 0, .3, .06, .1)], [B, M4(0, -.02, 0, .05, .18, .05)]]),
      staff: mergeParts([[cyl, M4(0, .35, 0, .07, 1.5, .07)], [new THREE.OctahedronGeometry(.12), M4(0, 1.15, 0)]]),
      bow: mergeParts([[new THREE.TorusGeometry(.45, .03, 4, 12, Math.PI), R(0, .1, 0, 1, 1, 1, 0, -Math.PI / 2, -Math.PI / 2)], [B, M4(0, .1, 0, .015, .9, .015)]]),
      axe: mergeParts([[cyl, M4(0, .3, 0, .07, 1, .07)], [B, M4(.15, .7, 0, .3, .3, .06)]]),
      dagger: mergeParts([[B, M4(0, .3, 0, .05, .42, .09)], [B, M4(0, .07, 0, .18, .04, .07)]]),
    };
    const mk = (geo, mat, colored) => {
      const m = new THREE.InstancedMesh(geo, mat, cap);
      if (colored) m.setColorAt(0, this._c.set(0xffffff));
      m.count = 0; m.frustumCulled = false; m.castShadow = true; scene.add(m); return m;
    };
    this.body = mk(body, new THREE.MeshLambertMaterial({ color: 0xffffff }), true);
    this.head = mk(head, new THREE.MeshLambertMaterial({ color: 0xf0cfa8 }));
    const wm = new THREE.MeshLambertMaterial({ color: 0xb8b4aa });
    this.weapons = {};
    for (const [w] of WEAPONS) this.weapons[w] = mk(wg[w], w === 'staff' || w === 'bow' ? MAT.wood : wm);
    this.icons = {};
    const plane = new THREE.PlaneGeometry(1, 1);
    for (const k of ['fight', 'quest', 'sad', 'lost']) {
      const m = new THREE.InstancedMesh(plane, new THREE.MeshBasicMaterial({ map: iconTexture(k), transparent: true, depthWrite: false }), 80);
      m.count = 0; m.frustumCulled = false; m.renderOrder = 20; scene.add(m); this.icons[k] = m;
    }
  },
  reindex() { this.map.clear(); for (const p of G.players) this.map.set(p.id, p); },
  cls(p) { return Classes.byId(p.cls) || G.classes[0]; },
  stats(p) {
    const c = this.cls(p), L = p.lv - 1;
    return { hp: Math.round(c.hp + c.gHp * L), atk: (c.atk + c.gAtk * L) * (1 + (p.atkB || 0)), def: (c.def + c.gDef * L) * (1 + (p.defB || 0)), spd: c.spd };
  },
  towns() { return G.objects.filter(o => o.type === 'town' || o.type === 'village'); },
  nearestTown(x, z) {
    let best = null, bd = Infinity;
    for (const t of this.towns()) { const d = Math.hypot(t.x - x, t.z - z) + (PG.compAt(t.x, t.z) === PG.compAt(x, z) ? 0 : 10000); if (d < bd) { bd = d; best = t; } }
    return best || { x: 0, z: 0 };
  },
  join() {
    const cs = G.classes, tot = cs.reduce((a, c) => a + Math.max(1, c.pop), 0);
    let r = Math.random() * tot, c = cs[0];
    for (const k of cs) { r -= Math.max(1, k.pop); if (r <= 0) { c = k; break; } }
    const tws = this.towns(), tw = tws.length ? pick(tws) : { x: 0, z: 0 };
    const p = {
      id: G.nextId++, name: genName(), cls: c.id, lv: 1, exp: 0, hp: 1, gold: 50, sat: 70 + (Research.has('tutorial') ? 10 : 0), spent: 0,
      done: [], quest: null, owned: [], atkB: 0, defB: 0, boostUntil: 0,
      x: tw.x + (Math.random() - .5) * 10, z: tw.z + (Math.random() - .5) * 10, ry: Math.random() * 6.28,

  // 目的地に着いたときの処理

  goTown(p) { const tw = this.nearestTown(p.x, p.z); this.goTo(p, tw.x + (Math.random() - .5) * 8, tw.z + (Math.random() - .5) * 8, 'town'); },

  teleportTown(p) { const tw = this.nearestTown(p.x, p.z); p.x = tw.x + (Math.random() - .5) * 10; p.z = tw.z + (Math.random() - .5) * 10; this.arriveTown(p); },

  // 描画対象外の加入者は1時間ごとに数値だけで狩りの結果を計算する

        if (p.st !== 'hunt') { const a = Math.random() * 6.28, r = Math.random() * sp.radius; p.x = sp.x + Math.cos(a) * r; p.z = sp.z + Math.sin(a) * r; p.st = 'hunt'; break; }

  hourly() {
    PG.processQueue();

    if (this.newLost) { log(`${this.newLost}人が迷子になりました(道がつながっていない狩り場・町があります)`, 'warn'); if (this.newLost >= 5) toast(`${this.newLost}人が迷子になっています`, 'warn'); }

    this.newLost = this.newFound = 0;
    for (const p of G.players) {
      if (!p.vis) this.abstractHour(p);
      if (p.lost) p.sat = Math.max(0, p.sat - .15);
    }
    // 不正者は周囲の、迷惑行為者は町にいる周囲の加入者の満足度を下げる
    // (1人が1時間に受ける悪影響は最大0.08まで。約−2/日)
    for (const q of G.players) q._annoy = 0;
    for (const b of G.players) {
      if (!(b.cheat || b.troll)) continue;
      if (!b.cheat && b.st !== 'idle') continue;
      const r = b.cheat ? 15 : 12, loss = (b.cheat ? .05 : .06) * (b.warned ? .4 : 1);
      for (const q of G.players) if (q !== b && Math.abs(q.x - b.x) < r && Math.abs(q.z - b.z) < r) q._annoy = Math.min(.08, q._annoy + loss);

    for (const q of G.players) if (q._annoy) q.sat = Math.max(0, q.sat - q._annoy);
  },
  daily() {
    for (const c of G.classes) { c.kills *= .7; c.killTime *= .7; c.basePower = classPower(c); }
    for (const p of G.players) { p.expYesterday = p.expToday; p.expToday = 0; }
    Classes.updatePopularity();
  },
  // カメラに近い順に描画上限まで3D表示し、残りは数値のみのシミュレーションにする
  updateVis() {
    const cap = QUALITY[S.quality].npc, cp = camera.position;
    const arr = G.players.slice();

const pointers = new Map();

canvas.addEventListener('pointerdown', e => {
  if (pointers.size >= 2) return;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });

    if (act === 'edit') Edit.down(e.clientX, e.clientY);

      clearTimeout(gest.lpTimer);

    }

canvas.addEventListener('pointermove', e => {

    return;
  }
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (!gest) return;
  const now = performance.now();

    if (!gest.moved && Math.hypot(p.x - p.sx, p.y - p.sy) > TAP_MOVE) { gest.moved = true; clearTimeout(gest.lpTimer); }
    if (!gest.moved) return;
    const dtm = Math.max(1, now - gest.lastT) / 1000; gest.lastT = now;
    if (gest.act === 'pan') {
      const [mx, mz] = Cam.panPixels(dx, dy);

function endPointer(e) {

   ════════════════════════════════════════════ */
let speedIdx = 1, prevSpeed = 1, tickAcc = 0;
function setSpeed(i) {
  if (i === speedIdx) return;
  if (speedIdx) prevSpeed = speedIdx;
  speedIdx = i;
  document.querySelectorAll('#speed button').forEach(b => b.classList.toggle('on', +b.dataset.speed === i));
}
$('#speed').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setSpeed(+b.dataset.speed); });
function simUpdate(dt) {
  const sp = SPEEDS[speedIdx];
  if (!sp) return;
  tickAcc += dt * sp / TICK_SEC;
  let n = 0;
  while (tickAcc >= 1 && n < 32) { tickAcc -= 1; tick(); n++; }
  if (tickAcc > 4) tickAcc = 0;
}
function tick() {
  G.hour++;
  Monsters.hourly();
  Players.hourly();
  Econ.hourly();
  if (G.hour >= 24) { G.hour = 0; G.day++; daily(); }
  if (G.hour === 6) { log('夜が明けました'); Sound.play('dawn', 3000); }
  if (G.hour === 19) { log('日が沈み、町に灯りがともりました'); Sound.play('dusk', 3000); }
}
function daily() {
  log(`${G.day}日目が始まりました`);
  Players.daily();
  Admin.daily();
  Econ.daily();
  if (G.over) return;
  const y = G.hist[G.hist.length - 1];
  if (y && y.rev > y.cost) Sound.play('coin', 1000);
  Events.daily();
  if (['biz', 'admin', 'research', 'class', 'quest'].includes(UI.tab) && !pb.contains(document.activeElement)) renderPanel();
}

(() => {
  const ph = $('#ph');
  let drag = null;
  ph.addEventListener('pointerdown', e => {
    if (UI.layout !== 'portrait' || e.target.closest('button')) return;
    ph.setPointerCapture(e.pointerId);
    drag = { y: e.clientY, h: panel.getBoundingClientRect().height, t: performance.now(), v: 0, ly: e.clientY };
    panel.classList.add('dragging');
  });
  ph.addEventListener('pointermove', e => {
    if (!drag) return;
    const H = sheetHeights(), now = performance.now();
    const h = clamp(drag.h - (e.clientY - drag.y), 0, H.full);
    drag.v = (e.clientY - drag.ly) / Math.max(1, now - drag.t); drag.t = now; drag.ly = e.clientY;
    panel.style.height = h + 'px';
  });
  const end = e => {
    if (!drag) return;
    panel.classList.remove('dragging');
    const H = sheetHeights(), h = panel.getBoundingClientRect().height, v = drag.v;
    const moved = Math.abs(e.clientY - drag.y) > 6;
    drag = null;
    if (!moved) { applyPanelLayout(); return; }
    let target;
    if (v < -.6) target = h > H.half + 10 || UI.sheet === 'half' ? 'full' : 'half';
    else if (v > .6) target = h < H.half - 10 || UI.sheet === 'half' ? 'closed' : 'half';
    else target = h > (H.half + H.full) / 2 ? 'full' : h > H.half * .55 ? 'half' : 'closed';
    if (target === 'closed') closePanel(); else { UI.sheet = target; applyPanelLayout(); }
  };
  ph.addEventListener('pointerup', end); ph.addEventListener('pointercancel', end);
})();

/* パネル内の数値入力(スライダー+−/+ボタン。キーボードを出さない) */
const FIELDS = {};
function stepper(key, label, val, min, max, step, fmtFn, set) {
  FIELDS[key] = { min, max, step, set, fmt: fmtFn };
  return `<div class="fld"><div class="fl-hd"><span>${label}</span><output data-o="${key}">${fmtFn(val)}</output></div>
    <div class="stp"><button class="sb" data-step="${key}" data-d="-1" aria-label="${label}を下げる">−</button><input type="range" data-fld="${key}" min="${min}" max="${max}" step="${step}" value="${val}" aria-label="${label}"><button class="sb" data-step="${key}" data-d="1" aria-label="${label}を上げる">+</button></div></div>`;
}
function fieldChange(key, v) {
  const F = FIELDS[key]; if (!F) return;
  v = +clamp(Math.round(v / F.step) * F.step, F.min, F.max).toFixed(2);
  F.set(v);
  syncField(key, v);
  if (key.startsWith('cl.')) { const c = Classes.byId(UI.clEdit); if (c) { Classes.scheduleCheck(c); const el = document.getElementById('clPower'); if (el) el.textContent = powerText(c); } }
}
function syncField(key, v) {
  const F = FIELDS[key]; if (!F) return;
  pb.querySelectorAll(`[data-fld="${key}"]`).forEach(i => { i.value = v; });
  pb.querySelectorAll(`[data-o="${key}"]`).forEach(o => { o.textContent = F.fmt(v); });
}
pb.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.fld) fieldChange(t.dataset.fld, +t.value);
  else if (t.dataset.name) setName(t.dataset.name, t.value);
});
pb.addEventListener('change', e => { if (e.target.dataset.fld && e.target.dataset.fld.startsWith('mt.')) refreshSpawnViews(); });
function setName(key, v) {
  const [kind, id] = key.split(':');
  if (kind === 'mt') { const t = Monsters.type(+id); if (t) t.name = v || '名無し'; }
  else if (kind === 'ar') { const a = G.areas.find(q => q.id === +id); if (a) a.name = v || '名無しのエリア'; }
  else if (kind === 'q') { const q = Quests.byId(+id); if (q) q.name = v || '名無しのクエスト'; }

const QKINDS = [['kill', '討伐'], ['collect', '収集'], ['goto', '移動'], ['boss', 'ボス討伐']];
const Quests = {
  flags: new Map(),
  byId(id) { return G.quests.find(q => q.id === id); },
  board(q) { return G.objects.find(o => o.id === q.board && o.type === 'board'); },
  boardQuests(bid) { return G.quests.filter(q => q.board === bid).sort((a, b) => a.order - b.order); },
  // 目標が成立しているか(モンスターがどこかに出現する/目的地がある)
  valid(q) {
    if (!this.board(q)) return false;
    if (q.kind === 'kill' || q.kind === 'boss') return !!Monsters.type(q.mt) && G.objects.some(o => o.type === 'spawn' && o.mt === q.mt);
    return q.tx != null;
  },
  prevOk(q, p) {
    if (!q.prev) return true;
    const list = this.boardQuests(q.board), i = list.indexOf(q);
    return i <= 0 || p.done.includes(list[i - 1].id);
  },
  fits(q, p) { return p.lv >= q.lv - 2 && p.lv <= q.lv + 6; },
  available(p) {
    const out = [];
    for (const q of G.quests) if (!p.done.includes(q.id) && this.fits(q, p) && this.prevOk(q, p) && this.valid(q)) out.push(q);
    return out;
  },
  pick(p) {
    const pc = PG.compAt(p.x, p.z);
    const av = this.available(p).filter(q => { const b = this.board(q); return PG.compAt(b.x, b.z) === pc && (q.kind === 'kill' || q.kind === 'boss' || PG.compAt(q.tx, q.tz) === pc); });
    if (!av.length) return null;
    av.sort((a, b) => a.order - b.order || Math.abs(a.lv - p.lv) - Math.abs(b.lv - p.lv));
    return av[Math.floor(Math.random() * Math.min(2, av.length))];
  },
  complete(p, q) {
    if (p.vis && nearCam(p.x, p.z)) Sound.play('quest', 600);
    Players.gainExp(p, q.exp); p.gold += q.gold;
    p.sat = Math.min(100, p.sat + 3);
    p.done.push(q.id); p.quest = null;
    q.cleared = (q.cleared || 0) + 1;
    G.today.quests++;
    if (q.cleared === 1) log(`クエスト「${q.name}」を${p.name}が初めてクリアしました`, 'good');
  },
  summary(q) {
    const t = Monsters.type(q.mt);
    if (q.kind === 'kill') return `${t ? t.name : '(未設定)'}を${q.count}体討伐`;
    if (q.kind === 'boss') return `${t ? t.name : '(未設定)'}を討伐`;
    if (q.kind === 'collect') return `${q.item || '素材'}を${q.count}個集める`;
    return '指定地点へ行く';
  },
  // 移動・収集クエストの目的地に旗を立てる
  rebuildFlags() {
    for (const g of this.flags.values()) scene.remove(g);
    this.flags.clear();
    for (const q of G.quests) {
      if ((q.kind !== 'goto' && q.kind !== 'collect') || q.tx == null) continue;
      const g = new THREE.Group();
      g.position.set(q.tx, heightAt(q.tx, q.tz), q.tz);
      part(g, GEO.cylB, MAT.wood, .12, 3, .12);
      const cloth = part(g, GEO.box, colorMat(q.kind === 'goto' ? 0x5bb8d9 : 0xe2c04a), 1.1, .7, .05, .58, 0, 2.55);
      cloth.userData.g = false;
      g.traverse(m => { if (m.isMesh) m.castShadow = true; });
      scene.add(g); this.flags.set(q.id, g);
    }
  },
  pickFor: 0,
  pickAt(x, y) {
    const q = this.byId(this.pickFor), g = pickGround(x, y);
    if (!q || !g) return;
    if (heightAt(g.x, g.z) < .2) { toast('水の上は目的地にできません', 'warn'); return; }
    q.tx = +g.x.toFixed(1); q.tz = +g.z.toFixed(1);
    this.rebuildFlags();
    toast('目的地を設定しました', 'good');
    setMode('view');
    UI.qEdit = q.id; UI.tab = null; openTab('quest');
  },
};

function questAction(a, b) {
  const v = +b.dataset.v;
  switch (a) {
    case 'qEdit': UI.qEdit = v; renderPanel(); pb.scrollTop = 0; return true;
    case 'qBack': UI.qEdit = null; renderPanel(); return true;
    case 'qNew': {
      const list = Quests.boardQuests(v), mt = (G.monsterTypes.find(t => !t.boss) || G.monsterTypes[0]).id;
      const q = { id: G.nextId++, board: v, order: list.length ? list[list.length - 1].order + 1 : 0, name: `新しいクエスト${G.quests.length + 1}`, kind: 'kill', mt, count: 5, item: '薬草', tx: null, tz: null, lv: 1, exp: 80, gold: 30, prev: list.length > 0, cleared: 0 };
      G.quests.push(q); UI.qEdit = q.id; renderPanel(); pb.scrollTop = 0; return true;
    }
    case 'qDel': {
      const q = Quests.byId(UI.qEdit); if (!q) return true;
      ask(`クエスト「${q.name}」を削除しますか?受注中の加入者は中断します。`, '削除する').then(ok => {
        if (!ok) return;
        G.quests.splice(G.quests.indexOf(q), 1);
        for (const p of G.players) if (p.quest && p.quest.id === q.id) p.quest = null;
        UI.qEdit = null; Quests.rebuildFlags(); renderPanel();
      });
      return true;
    }
    case 'qKind': { const q = Quests.byId(UI.qEdit); q.kind = b.dataset.v; if (q.kind === 'boss') { const t = G.monsterTypes.find(m => m.boss); q.mt = t ? t.id : 0; q.count = 1; } else if (q.kind === 'kill') { const t = Monsters.type(q.mt); if (!t || t.boss) q.mt = (G.monsterTypes.find(m => !m.boss) || {}).id || 0; } Quests.rebuildFlags(); renderPanel(); return true; }
    case 'qMt': { const q = Quests.byId(UI.qEdit); q.mt = v; renderPanel(); return true; }
    case 'qPrev': { const q = Quests.byId(UI.qEdit); q.prev = !q.prev; renderPanel(); return true; }
    case 'qPick': { Quests.pickFor = UI.qEdit; closePanel(); setMode('pick'); return true; }
    case 'qSee': { const q = Quests.byId(UI.qEdit); if (q && q.tx != null) { Cam.flyTo(q.tx, q.tz, { dist: Math.min(Cam.dist, 90) }); if (UI.layout === 'portrait') closePanel(); } return true; }
    case 'qBoardFly': { const o = G.objects.find(x => x.id === v); if (o) { Cam.flyTo(o.x, o.z, { dist: Math.min(Cam.dist, 70) }); if (UI.layout === 'portrait') closePanel(); } return true; }
    case 'qUp': case 'qDown': {
      const q = Quests.byId(v), list = Quests.boardQuests(q.board), i = list.indexOf(q), j = a === 'qUp' ? i - 1 : i + 1;
      if (j < 0 || j >= list.length) return true;
      const o = list[j].order; list[j].order = q.order; q.order = o;
      renderPanel(); return true;
    }
  }
  return false;
}

    return G.research >= r.cost ? 'ok' : 'short';

  buy(id) {

    if (!r || this.state(r) !== 'ok') return;
    G.research -= r.cost; G.unlocked.push(r.id);
    log(`研究「${r.name}」が完了しました`, 'good'); toast(`研究完了:${r.name}`, 'good');
    renderBrushBar();
  },
};

/* ════════════════════════════════════════════
   経営:収益モデル・課金アイテム・サーバー費
   ════════════════════════════════════════════ */
const ITEM_KINDS = {
  potion: { name: 'ポーション', ref: 30, desc: '消耗品。何度でも買われる' },
  weapon: { name: '武器', ref: 200, req: 'shop_weapon', power: 'atk', once: true, desc: '攻撃力が上がる' },
  armor: { name: '防具', ref: 180, req: 'shop_armor', power: 'def', once: true, desc: '防御力が上がる' },
  booster: { name: '経験値ブースター', ref: 120, req: 'shop_booster', desc: '24時間 経験値1.5倍' },
  cosmetic: { name: '見た目アイテム', ref: 80, req: 'shop_cosmetic', once: true, desc: '購入者の満足度+2' },
};
const P2W_LIMIT = 20;
const newToday = () => ({ rev: 0, revSub: 0, revItem: 0, cost: 0, server: 0, gm: 0, build: 0, event: 0, rp: 0, joins: 0, leaves: 0, quests: 0, bans: 0 });
const Econ = {
  serverBase() { return Research.has('server2') ? 30 : 50; },
  perPlayer() { return Research.has('server') ? 1.5 : 2; },
  dailyCost() { return this.serverBase() + this.perPlayer() * G.players.length + 30 * G.gms; },
  night() { return G.hour >= 20 || G.hour < 5; },
  expMult(p) {
    let m = 1;
    if (p.boostUntil && p.boostUntil > G.day * 24 + G.hour) m *= 1.5;
    if (Research.has('daynight') && this.night()) m *= 1.5;
    return m;
  },
  spend(amount, kind) { G.money -= amount; G.today.cost += amount; G.today[kind] = (G.today[kind] || 0) + amount; },
  earn(amount, kind) { G.money += amount; G.today.rev += amount; G.today[kind] += amount; G.research += amount * .1; G.today.rp += amount * .1; },
  buyProb(p, it) {
    const k = ITEM_KINDS[it.kind];
    return .1 * clamp(p.sat / 60, .2, 1.6) * clamp(Math.pow(k.ref / Math.max(1, it.price), .7), .15, 2.5) / Math.sqrt(Math.max(1, G.items.length));
  },
  buy(p, it) {
    const k = ITEM_KINDS[it.kind];
    this.earn(it.price, 'revItem'); p.spent += it.price; it.sold = (it.sold || 0) + 1;
    if (k.once) p.owned.push(it.id);
    if (k.power === 'atk') p.atkB = Math.max(p.atkB || 0, it.power / 100);
    if (k.power === 'def') p.defB = Math.max(p.defB || 0, it.power / 100);
    if (it.kind === 'booster') p.boostUntil = G.day * 24 + G.hour + 24;
    if (it.kind === 'cosmetic') p.sat = Math.min(100, p.sat + 2);
  },
  hourly() {
    const N = G.players.length;
    if (G.model === 'sub') this.earn(15 * N / 24, 'revSub');
    else for (const it of G.items) {
      if (!Research.has(ITEM_KINDS[it.kind].req)) continue;
      for (const p of G.players) {
        if (ITEM_KINDS[it.kind].once && p.owned.includes(it.id)) continue;
        if (Math.random() < this.buyProb(p, it) / 24) this.buy(p, it);
      }
    }
    this.spend((this.serverBase() + this.perPlayer() * N) / 24, 'server');
    if (G.gms) this.spend(30 * G.gms / 24, 'gm');
    // サーバー障害中は満足度が下がり続ける
    if (G.effects.outage > G.day * 24 + G.hour) for (const p of G.players) p.sat = Math.max(0, p.sat - .3);
    // 月夜の宴(昼夜イベントの研究後、20〜23時に町にいる加入者)
    if (Research.has('daynight') && G.hour >= 20) for (const p of G.players) if (p.st === 'idle') p.sat = Math.min(100, p.sat + .15);
    if (Research.has('daynight') && G.hour === 20) log('町で「月夜の宴」が始まりました(夜の討伐は経験値1.5倍)');
    Requests.check();
  },
  // 1日ごとの満足度ルール・加入と退会・記録
  daily() {
    const N0 = G.players.length;
    const areaCount = new Map();
    for (const p of G.players) { const a = Areas.at(p.x, p.z); if (a && p.st !== 'idle') areaCount.set(a.id, (areaCount.get(a.id) || 0) + 1); }
    const crowded = new Set(G.areas.filter(a => (areaCount.get(a.id) || 0) > Math.max(4, (a.x1 - a.x0) * (a.z1 - a.z0) / 150)).map(a => a.id));
    const p2w = G.model === 'f2p' && G.items.some(it => ITEM_KINDS[it.kind].power && Research.has(ITEM_KINDS[it.kind].req) && it.power > P2W_LIMIT);
    const innTowns = new Set(Players.towns().filter(t => G.objects.some(o => o.type === 'inn' && Math.hypot(o.x - t.x, o.z - t.z) < 45)).map(t => t.id));
    const cnt = { quest: 0, area: 0, crowd: 0 };
    for (const p of G.players) {
      let d = 0;
      if (!Quests.available(p).length) { d -= 2; cnt.quest++; }
      if (!G.areas.some(a => p.lv >= a.lvMin && p.lv <= a.lvMax)) { d -= 3; cnt.area++; }
      const a = Areas.at(p.x, p.z);
      if (a && crowded.has(a.id)) { d -= 1; cnt.crowd++; }
      if (p2w) d -= 2;
      if (innTowns.size && innTowns.has(Players.nearestTown(p.x, p.z).id)) d += 1;
      p.sat = clamp(p.sat + d, 0, 100);
    }
    G.lastRules = { ...cnt, p2w, n: G.players.length };
    // 退会:満足度20未満は1日ごとに10%の確率で離脱
    const leavers = G.players.filter(p => p.sat < 20 && Math.random() < .1);
    for (const p of leavers) Players.remove(p);
    G.today.leaves += leavers.length;
    if (leavers.length) log(`${leavers.length}人が不満を理由に退会しました`, 'bad');
    // 新規加入:平均満足度×0.05(口コミ・広告・イベントで増減)
    const N = G.players.length, avg = N ? G.players.reduce((a, p) => a + p.sat, 0) / N : 60;
    const now = G.day * 24;
    let mult = 1 + N / 150;
    if (G.effects.rival > now) mult *= .5;
    if (G.effects.buzz > now) mult *= 1.6;
    if (Research.has('ads')) mult *= 1.25;
    if (G.effects.outage > now) mult = 0;
    const joins = N >= 1500 ? 0 : Math.floor(Math.floor(avg * .05) * mult + Math.random());
    for (let i = 0; i < joins; i++) Players.join();
    G.today.joins += joins;
    if (joins) log(`新規加入者が${joins}人ありました`, 'good');
    // 記録
    const N2 = G.players.length, sat2 = N2 ? G.players.reduce((a, p) => a + p.sat, 0) / N2 : 0;
    G.hist.push({ d: G.day - 1, rev: Math.round(G.today.rev), cost: Math.round(G.today.cost), subs: N2, sat: +sat2.toFixed(1), rp: G.today.rp, joins: G.today.joins, leaves: G.today.leaves, quests: G.today.quests });
    if (G.hist.length > 730) G.hist.shift();
    G.today = newToday();
    // 資金がマイナスのまま30日でゲームオーバー
    if (G.money < 0) {
      G.negDays++;
      if ([1, 10, 20, 25, 28].includes(G.negDays)) toast(`資金がマイナスです(${G.negDays}日目 / 30日でサービス終了)`, 'bad');
      if (G.negDays >= 30) gameOver();
    } else G.negDays = 0;
    if (!G.goalReached && N2 >= 1000) { G.goalReached = true; goalReached(); }
    void N0;
  },
};

/* ════════════════════════════════════════════
   経営ダッシュボード(Canvas 2D の自前グラフ)

const CHARTS = [
  ['rev', '収益(G/日)', v => fmt(v) + 'G'],
  ['cost', '支出(G/日)', v => fmt(v) + 'G'],
  ['subs', '加入者数', v => fmt(v) + '人'],
  ['sat', '平均満足度', v => v.toFixed(1)],
];
const Charts = {
  sel: {},
  data(key) { return G.hist.slice(-90); },
  drawAll() { document.querySelectorAll('canvas[data-chart]').forEach(cv => this.draw(cv)); },
  draw(cv) {
    const key = cv.dataset.chart, def = CHARTS.find(c => c[0] === key), rows = this.data(key);
    const dpr = Math.min(2, devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
    if (!W) return;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    const ink = '#a6a192', grid = 'rgba(228,220,198,.12)', acc = '#e2a64b', ff = '12px ' + getComputedStyle(document.body).fontFamily;
    c.font = ff; c.textBaseline = 'middle';
    if (rows.length < 2) { c.fillStyle = ink; c.textAlign = 'center'; c.fillText('2日目以降にグラフが表示されます', W / 2, H / 2); return; }
    const vals = rows.map(r => r[key]);
    let max = key === 'sat' ? 100 : Math.max(1, ...vals);
    if (key !== 'sat') { const m = Math.pow(10, Math.floor(Math.log10(max))), s = [1, 2, 2.5, 5, 10].find(k => k * m >= max); max = s * m; }
    const L = 48, R = 12, T = 12, B = 26, pw = W - L - R, ph = H - T - B;
    const X = i => L + (rows.length === 1 ? pw / 2 : i / (rows.length - 1) * pw), Y = v => T + ph - v / max * ph;
    c.strokeStyle = grid; c.lineWidth = 1; c.fillStyle = ink; c.textAlign = 'right';
    for (let k = 0; k <= 2; k++) {
      const v = max * k / 2, y = Math.round(Y(v)) + .5;
      c.beginPath(); c.moveTo(L, y); c.lineTo(W - R, y); c.stroke();
      c.fillText(v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'k' : String(Math.round(v)), L - 6, y);
    }
    c.textAlign = 'left'; c.fillText(`${rows[0].d}日`, L, H - 10);
    c.textAlign = 'right'; c.fillText(`${rows[rows.length - 1].d}日`, W - R, H - 10);
    // 面と線
    c.beginPath(); vals.forEach((v, i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v)));
    c.lineTo(X(vals.length - 1), Y(0)); c.lineTo(X(0), Y(0)); c.closePath();
    c.fillStyle = 'rgba(226,166,75,.14)'; c.fill();
    c.beginPath(); vals.forEach((v, i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v)));
    c.strokeStyle = acc; c.lineWidth = 2; c.lineJoin = 'round'; c.stroke();
    const dot = (i, r) => { c.beginPath(); c.arc(X(i), Y(vals[i]), r, 0, 7); c.fillStyle = acc; c.fill(); c.lineWidth = 2; c.strokeStyle = '#161c23'; c.stroke(); };
    dot(vals.length - 1, 4);
    // タップした位置の数値
    const si = this.sel[key];
    if (si != null && si < vals.length) {
      const x = X(si);
      c.strokeStyle = 'rgba(236,230,214,.5)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x + .5, T); c.lineTo(x + .5, T + ph); c.stroke();
      dot(si, 5);
      const txt = `${rows[si].d}日目 ${def[2](vals[si])}`;
      c.font = '600 ' + ff; const tw = c.measureText(txt).width + 16;
      const bx = clamp(x - tw / 2, L, W - R - tw), by = clamp(Y(vals[si]) - 36, 2, H - 30);
      c.fillStyle = '#252e38'; c.strokeStyle = 'rgba(228,220,198,.25)';
      c.beginPath(); c.roundRect ? c.roundRect(bx, by, tw, 26, 6) : c.rect(bx, by, tw, 26); c.fill(); c.stroke();
      c.fillStyle = '#ece6d6'; c.textAlign = 'left'; c.fillText(txt, bx + 8, by + 13);
    }
  },
  tap(cv, clientX) {
    const key = cv.dataset.chart, rows = this.data(key), r = cv.getBoundingClientRect();
    if (rows.length < 2) return;
    const pw = r.width - 60, i = Math.round(clamp((clientX - r.left - 48) / pw, 0, 1) * (rows.length - 1));
    this.sel[key] = i; this.draw(cv);
  },
};
pb.addEventListener('pointerdown', e => { const cv = e.target.closest('canvas[data-chart]'); if (cv) Charts.tap(cv, e.clientX); });

/* ════════════════════════════════════════════
   ランダムイベントと要望

const Requests = {
  make() {
    const opts = [], N = G.players.length;
    const lvs = G.players.map(p => p.lv).sort((a, b) => a - b), med = lvs[Math.floor(lvs.length / 2)] || 1;
    const snap = G.nextId;
    opts.push(() => ({ kind: 'area', lv: med, text: `Lv${med}〜${med + 4}向けの新しいエリアがほしい`, snap }));
    if (G.classes.length > 1) {
      const byP = G.classes.slice().sort((a, b) => classPower(a) - classPower(b));
      opts.push(() => ({ kind: 'weak', cls: byP[0].id, base: classPower(byP[0]), text: `${byP[0].name}が弱い。強くしてほしい` }));
      opts.push(() => ({ kind: 'strong', cls: byP[byP.length - 1].id, base: classPower(byP[byP.length - 1]), text: `${byP[byP.length - 1].name}が強すぎる。調整してほしい` }));
    }
    opts.push(() => ({ kind: 'monster', snap, text: '新しいモンスターと戦いたい' }));
    opts.push(() => ({ kind: 'quest', base: G.quests.length, text: 'クエストをもっと増やしてほしい' }));
    opts.push(() => ({ kind: 'boss', text: 'ボスと戦いたい' }));
    opts.push(() => ({ kind: 'road', base: G.objects.filter(o => o.type === 'road').length, text: '町と狩り場を結ぶ道がほしい' }));
    if (N > 30) opts.push(() => ({ kind: 'town', base: Players.towns().length, text: '町が混雑している。新しい拠点がほしい' }));
    opts.push(() => ({ kind: 'inn', base: G.objects.filter(o => o.type === 'inn').length, text: '休める宿屋がほしい' }));
    if (med >= 5) opts.push(() => ({ kind: 'dungeon', base: G.objects.filter(o => o.type === 'dungeon').length, text: 'ダンジョンに挑戦したい' }));
    const active = new Set(G.requests.filter(r => !r.state).map(r => r.kind));
    const cand = opts.map(f => f()).filter(r => !active.has(r.kind));
    if (!cand.length) return;
    const r = pick(cand);
    r.id = G.nextId++; r.day = G.day; r.deadline = G.day + 7 + (Research.has('community') ? 3 : 0); r.state = '';
    G.requests.push(r);
    log(`要望:「${r.text}」(期限 ${r.deadline}日目)`, 'warn');
    toast(`加入者からの要望:${r.text}`, 'warn');
  },
  met(r) {
    switch (r.kind) {
      case 'area': return G.areas.some(a => a.id > r.snap && a.lvMin <= r.lv + 2 && a.lvMax >= r.lv + 1);
      case 'weak': { const c = Classes.byId(r.cls); return !c || classPower(c) >= r.base * 1.1; }
      case 'strong': { const c = Classes.byId(r.cls); return !c || classPower(c) <= r.base * .92; }
      case 'monster': return G.monsterTypes.some(t => t.id > r.snap && G.objects.some(o => o.type === 'spawn' && o.mt === t.id));
      case 'quest': return G.quests.length >= r.base + 2;
      case 'boss': return G.objects.some(o => o.type === 'spawn' && Monsters.type(o.mt)?.boss);
      case 'road': return G.objects.filter(o => o.type === 'road').length > r.base;
      case 'town': return Players.towns().length > r.base;
      case 'inn': return G.objects.filter(o => o.type === 'inn').length > r.base;
      case 'dungeon': return G.objects.filter(o => o.type === 'dungeon').length > r.base;
    }
    return false;
  },
  check() {
    for (const r of G.requests) {
      if (r.state) continue;
      if (this.met(r)) {
        r.state = 'done';
        const bonus = 6 + (Research.has('community') ? 2 : 0);
        for (const p of G.players) p.sat = Math.min(100, p.sat + bonus);
        G.research += 30;
        log(`要望「${r.text}」に応えました(全員の満足度+${bonus}、研究+30)`, 'good');
        toast(`要望に応えました:満足度+${bonus}`, 'good');
      } else if (G.day > r.deadline) {
        r.state = 'failed';
        for (const p of G.players) p.sat = Math.max(0, p.sat - 3);
        log(`要望「${r.text}」の期限が過ぎました(全員の満足度−3)`, 'bad');
      }
    }
    if (G.requests.length > 40) G.requests = G.requests.filter(r => !r.state).concat(G.requests.filter(r => r.state).slice(-20));
  },
};

const Events = {
  daily() {

    for (const x of pool) { r -= x.w; if (r <= 0) { x.e.run(); return; } }
  },
};

const Admin = {
  avgExp() { const a = G.players.filter(p => p.expYesterday > 0); return a.length ? a.reduce((s, p) => s + p.expYesterday, 0) / a.length : 0; },
  // 経験値の伸びが平均の3倍以上の加入者
  suspects() {
    const avg = this.avgExp();
    if (!avg) return [];
    return G.players.filter(p => p.expYesterday >= avg * 3 && p.expYesterday > 40 && !(p.ignoreUntil > G.day) && (!Research.has('automod') || p.cheat))
      .sort((a, b) => b.expYesterday - a.expYesterday);
  },
  trolls() { return G.players.filter(p => p.reported && p.troll && !(p.ignoreUntil > G.day)); },
  troubled() { return G.players.filter(p => p.lost || p.sat < 20).sort((a, b) => (b.lost - a.lost) || a.sat - b.sat); },
  ban(p) {
    const wasBad = p.cheat || p.troll;
    Players.remove(p);
    G.stats.bans++; G.today.bans++;
    if (wasBad) { for (const q of G.players) if (Math.hypot(q.x - p.x, q.z - p.z) < 25) q.sat = Math.min(100, q.sat + 1); log(`${p.name}をBANしました`, 'good'); }
    else { for (const q of G.players) q.sat = Math.max(0, q.sat - 2); log(`${p.name}をBANしました。不正の証拠がなく「誤BANでは」と騒ぎになっています(全員−2)`, 'bad'); toast('誤BANの疑いで炎上(満足度−2)', 'bad'); }
  },
  warn(p, byGM) {
    p.warned = (p.warned || 0) + 1; G.stats.warns++;
    if (p.cheat && Math.random() < .6) p.cheat = false;
    if (p.troll && Math.random() < .6) { p.troll = false; p.reported = false; }
    p.ignoreUntil = G.day + 2;
    if (!byGM) log(`${p.name}に警告しました`);
  },
  ignore(p) { p.ignoreUntil = G.day + 3; },
  rescue(p) {
    Players.teleportTown(p); p.lost = false; p.lostCount = 0; p.sat = Math.min(100, p.sat + 2); p.path = null;
    G.stats.rescues++;
  },
  daily() {
    // 迷惑行為者は町で周囲から通報される
    for (const p of G.players) if (p.troll && Math.random() < .35) p.reported = true;
    // GMの自動対応
    if (G.gms > 0) {
      let rescued = 0, warned = 0;
      const lost = G.players.filter(p => p.lost);
      for (const p of lost.slice(0, G.gms * 6)) { this.rescue(p); rescued++; }
      const cap = G.gms * (Research.has('automod') ? 4 : 2);
      for (const p of this.suspects().concat(this.trolls()).slice(0, cap)) { this.warn(p, true); warned++; }
      G.gmLog = { day: G.day, rescued, warned };
      if (rescued || warned) log(`GMが${rescued}人を救助し、${warned}人に警告しました`);
    }
  },
};
function playerCard(p, kind) {
  const c = Players.cls(p), avg = Admin.avgExp();
  const detail = kind === 'cheat' ? `昨日の経験値 ${fmt(p.expYesterday)}(平均の${avg ? (p.expYesterday / avg).toFixed(1) : '—'}倍)`
    : kind === 'troll' ? '町での迷惑行為が通報されています' : p.lost ? '迷子:道が見つからず困っています' : `満足度 ${Math.round(p.sat)}:退会しそうです`;
  const btns = kind === 'help' ? `${p.lost ? `<button class="btn sm pri" data-act="adRescue" data-v="${p.id}">救助</button>` : ''}<button class="btn sm" data-act="adGo" data-v="${p.id}">現地へ移動</button>`
    : `<button class="btn sm danger" data-act="adBan" data-v="${p.id}">BAN</button><button class="btn sm" data-act="adWarn" data-v="${p.id}">警告</button><button class="btn sm" data-act="adIgnore" data-v="${p.id}">放置</button><button class="btn sm" data-act="adGo" data-v="${p.id}">現地へ移動</button>`;
  return `<div class="ecard" style="border-left-color:${kind === 'help' ? 'var(--edit)' : 'var(--bad)'}">
    <div class="hd"><b><span class="cdot" style="background:${c.color}"></span>${esc(p.name)}</b><span class="meta">${esc(c.name)} Lv${p.lv}${p.warned ? ' · 警告済み' : ''}</span></div>
    <p class="meta">${detail}</p><div class="row wrapbtn">${btns}</div></div>`;
}
function adminPanel() {
  const reqs = G.requests.filter(r => !r.state), sus = Admin.suspects(), tr = Admin.trolls(), help = Admin.troubled();
  const lostN = G.players.filter(p => p.lost).length;
  return `<div class="sec"><h4>要望(${reqs.length})</h4>${reqs.map(r => `<div class="ecard" style="border-left-color:var(--warn)"><b>「${esc(r.text)}」</b>
      <p class="meta">期限 ${r.deadline}日目(あと${Math.max(0, r.deadline - G.day)}日)· 応えると全員の満足度+${6 + (Research.has('community') ? 2 : 0)}、期限切れで−3</p></div>`).join('') || '<p class="hint">いまは要望はありません。ときどき加入者から届きます。</p>'}

    <div class="sec"><h4>迷惑行為の通報(${tr.length})</h4>${tr.slice(0, 20).map(p => playerCard(p, 'troll')).join('') || '<p class="hint">通報はありません</p>'}</div>
    <div class="sec"><div class="row"><h4 class="grow">困っている加入者(${help.length})</h4>${lostN ? `<button class="btn sm pri" data-act="adRescueAll">迷子を全員救助(${lostN})</button>` : ''}</div>
      ${help.slice(0, 20).map(p => playerCard(p, 'help')).join('') || '<p class="hint">困っている加入者はいません</p>'}</div>
    <div class="sec"><h4>GM(ゲームマスター)</h4>
      ${Research.has('gm') ? `${stepper('gm.n', '雇用人数', G.gms, 0, 20, 1, intf('人'), v => { G.gms = v; })}
        <p class="hint">給料30G/日/人。GM1人につき毎日、迷子6人を救助し、不正の疑い・迷惑行為者${Research.has('automod') ? '4' : '2'}人に警告します。</p>
        ${G.gmLog ? `<p class="meta">${G.gmLog.day}日目:救助 ${G.gmLog.rescued}人 · 警告 ${G.gmLog.warned}人</p>` : ''}`
        : '<p class="hint">研究「GM制度」で雇用できるようになります。</p><button class="btn sm" data-act="goResearch">研究タブを開く</button>'}</div>
    <div class="sec"><div class="cards"><div class="card"><i>BAN</i><b>${G.stats.bans}</b></div><div class="card"><i>警告</i><b>${G.stats.warns}</b></div><div class="card"><i>救助</i><b>${G.stats.rescues}</b></div></div></div>`;
}
function adminAction(a, b) {
  const p = Players.map.get(+b.dataset.v);
  switch (a) {
    case 'adBan': if (p) ask(`${p.name}をBANしますか?即時退会となり、この加入者からの収益はなくなります。`, 'BANする').then(ok => { if (ok) { Admin.ban(p); renderPanel(); } }); return true;
    case 'adWarn': if (p) { Admin.warn(p); toast(`${p.name}に警告しました`); renderPanel(); } return true;
    case 'adIgnore': if (p) { Admin.ignore(p); renderPanel(); } return true;
    case 'adRescue': if (p) { Admin.rescue(p); toast(`${p.name}を町へ送りました`, 'good'); renderPanel(); } return true;
    case 'adRescueAll': { const l = G.players.filter(q => q.lost); l.forEach(q => Admin.rescue(q)); toast(`${l.length}人を救助しました`, 'good'); log(`迷子${l.length}人を町へ送りました`); renderPanel(); return true; }
    case 'adGo': if (p) { Cam.flyTo(p.x, p.z, { dist: Math.min(Cam.dist, 45) }); if (UI.layout === 'portrait') closePanel(); select({ kind: 'player', pl: p }); } return true;
    case 'goResearch': UI.tab = null; openTab('research'); return true;
    case 'rBuy': Research.buy(b.dataset.v); renderPanel(); return true;
    case 'model': {
      const m = b.dataset.v; if (m === G.model) return true;
      ask(`収益モデルを「${m === 'sub' ? '月額課金' : '基本無料'}」に変更しますか?加入者の満足度が一度だけ5下がります。`, '変更する').then(ok => {
        if (!ok) return;
        G.model = m; for (const q of G.players) q.sat = Math.max(0, q.sat - 5);
        if (m === 'f2p' && !G.items.length) G.items.push({ id: G.nextId++, kind: 'potion', name: '回復ポーション', price: 30, power: 0, sold: 0 });
        log(`収益モデルを${m === 'sub' ? '月額課金' : '基本無料'}に変更しました`, 'warn'); renderPanel();
      });
      return true;
    }
    case 'itNew': {
      const k = ITEM_KINDS[b.dataset.v];
      G.items.push({ id: G.nextId++, kind: b.dataset.v, name: k.name, price: k.ref, power: k.power ? 10 : 0, sold: 0 });
      renderPanel(); return true;
    }
    case 'itDel': { const i = G.items.findIndex(x => x.id === +b.dataset.v); if (i >= 0) G.items.splice(i, 1); renderPanel(); return true; }
  }
  return false;
}
