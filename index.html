/* ════════════════════════════════════════════
   セーブ/ロード(JSON)
   ════════════════════════════════════════════ */
function bytesToB64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToBytes(b) { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
const TRANSIENT = ['path', 'pi', 'queued', 'vis', '_d', '_mv', 'wt', '_annoy', 'swing', 'scan', 'huntT', 'fightT', 'mt', 'atkCd'];
function serialize() {
  const h16 = new Int16Array(DN * DN);
  G.terrain.h.forEach((v, i) => { h16[i] = Math.round(v * 100); });
  const players = G.players.map(p => { const o = { ...p }; for (const k of TRANSIENT) delete o[k]; if (o.st === 'fight' || o.st === 'waitpath') o.st = o.purpose === 'town' ? 'return' : 'travel'; return o; });
  const out = {
    format: 'arcana-online-save', v: 2, savedAt: new Date().toISOString(),
    seed: G.seed, day: G.day, hour: G.hour, money: Math.round(G.money), research: G.research, model: G.model,
    terrain: { n: DN, h: bytesToB64(new Uint8Array(h16.buffer)), t: bytesToB64(G.terrain.t) },
    objects: G.objects, areas: G.areas, monsterTypes: G.monsterTypes,
    monsters: G.monsters.map(m => ({ id: m.id, sp: m.sp, t: m.t, x: +m.x.toFixed(2), z: +m.z.toFixed(2), hp: Math.round(m.hp), tx: m.tx, tz: m.tz, wait: 1, ry: m.ry, ph: m.ph })),
    classes: G.classes, players, quests: G.quests, items: G.items, unlocked: G.unlocked, gms: G.gms,
    hist: G.hist, today: G.today, negDays: G.negDays, goalReached: G.goalReached, requests: G.requests, effects: G.effects, stats: G.stats,
    nextId: G.nextId, logs: G.logs.slice(-60),
    camera: { x: Cam.target.x, z: Cam.target.z, yaw: Cam.yaw, pitch: Cam.pitch, dist: Cam.dist },
  };
  return JSON.stringify(out);
}
// 形式を検査してから新しい状態を組み立てる(不正なら例外。現在の状態は変更しない)
function deserialize(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { throw new Error('JSONとして読み取れませんでした'); }
  if (!d || d.format !== 'arcana-online-save') throw new Error('このゲームのセーブデータではありません');
  if (d.v !== 2) throw new Error(`対応していないバージョンです(v${d.v})`);
  const num = (v, k) => { if (typeof v !== 'number' || !isFinite(v)) throw new Error(`${k} が数値ではありません`); return v; };
  const arr = (v, k) => { if (!Array.isArray(v)) throw new Error(`${k} がありません`); return v; };
  num(d.day, 'day'); num(d.hour, 'hour'); num(d.money, 'money'); num(d.nextId, 'nextId');
  if (!d.terrain || d.terrain.n !== DN) throw new Error('地形データの大きさが合いません');
  let hb, tb;
  try { hb = b64ToBytes(d.terrain.h); tb = b64ToBytes(d.terrain.t); } catch (e) { throw new Error('地形データが壊れています'); }
  if (hb.length !== DN * DN * 2 || tb.length !== DN * DN) throw new Error('地形データの長さが合いません');
  const h16 = new Int16Array(hb.buffer), h = new Float32Array(DN * DN);
  for (let i = 0; i < h.length; i++) h[i] = clamp(h16[i] / 100, SEA_FLOOR, H_MAX);
  for (const k of ['objects', 'areas', 'monsterTypes', 'monsters', 'classes', 'players', 'quests', 'items', 'unlocked', 'hist', 'requests']) arr(d[k], k);
  if (!d.classes.length) throw new Error('クラスが1つもありません');
  if (!d.monsterTypes.length) throw new Error('モンスターの種類が1つもありません');
  for (const o of d.objects) { if (!PLACE_DEFS[o.type]) throw new Error(`不明な配置物 ${o.type}`); num(o.x, 'objects.x'); num(o.z, 'objects.z'); }
  for (const p of d.players) { num(p.x, 'players.x'); num(p.z, 'players.z'); num(p.lv, 'players.lv'); if (!Array.isArray(p.done)) p.done = []; if (!Array.isArray(p.owned)) p.owned = []; p.sk = [0, 0]; p.vis = false; p.path = null; }
  for (const c of d.classes) { if (!Array.isArray(c.skills) || c.skills.length < 2) throw new Error('クラスのスキル情報が壊れています'); }
  return {
    version: 2, seed: d.seed || 1, day: d.day, hour: d.hour, money: d.money, research: +d.research || 0, model: d.model === 'f2p' ? 'f2p' : 'sub',
    subscribers: d.players.length, satisfaction: 0,
    terrain: { n: DN, h, t: new Uint8Array(tb) },
    objects: d.objects, areas: d.areas, monsterTypes: d.monsterTypes, monsters: d.monsters, classes: d.classes, players: d.players,
    quests: d.quests, items: d.items, unlocked: d.unlocked, gms: +d.gms || 0, hist: d.hist, today: Object.assign(newToday(), d.today || {}),
    negDays: +d.negDays || 0, goalReached: !!d.goalReached, requests: d.requests, effects: Object.assign({ outage: 0, rival: 0, buzz: 0 }, d.effects || {}),
    stats: Object.assign({ bans: 0, warns: 0, rescues: 0 }, d.stats || {}), nextId: d.nextId, logs: Array.isArray(d.logs) ? d.logs : [],
    _camera: d.camera,
  };
}
// 世界を差し替えて、描画・経路・索引をすべて作り直す
function applyWorld(ng) {
  const old = G;
  try {
    G = ng;
    Terrain.refresh(); Scenery.rebuild(); Objects.rebuildAll(); Areas.rebuildAll(); Quests.rebuildFlags();
    PG.dirty = true; PG.queue.length = 0;
    Players.reindex(); Players.visList = []; Monsters.index();
    Minimap.redrawBase();
    select(null); setFollow(null); if (mode !== 'view') setMode('view');
    UI.mtEdit = UI.clEdit = UI.qEdit = null;
    const c = ng._camera; delete ng._camera;
    if (c) { Cam.target.x = c.x; Cam.target.z = c.z; Cam.yaw = c.yaw; Cam.pitch = c.pitch; Cam.dist = c.dist; } else Cam.home();
    Players.updateVis(); tickAcc = 0; renderLog(); uiUpdate(); renderBrushBar();
    if (UI.tab) renderPanel();
  } catch (e) {
    G = old;
    Terrain.refresh(); Scenery.rebuild(); Objects.rebuildAll(); Areas.rebuildAll(); Quests.rebuildFlags(); PG.dirty = true; Players.reindex(); Monsters.index(); Minimap.redrawBase();
    throw e;
  }
}
function newWorld(model) {
  const g = newGame((Math.random() * 1e9) | 0);
  g.model = model;
  if (model === 'f2p') g.items.push({ id: g.nextId++, kind: 'potion', name: '回復ポーション', price: 30, power: 0, sold: 0 });
  applyWorld(g);
  initWorldContent();
  log('新しいサーバーで運営を開始しました', 'good');
}

    <div class="sec"><h4>ロード</h4>
      <p class="hint">保存しておいたJSONを貼り付けて読み込みます。形式が正しくない場合は、今の状態のまま変わりません。</p>

  const h = Math.round(vv ? Math.min(innerHeight, vv.height) : innerHeight) || innerHeight;

/* ════════════════════════════════════════════
   FPS計測と画質自動確認
   ════════════════════════════════════════════ */
let fpsFrames = 0, fpsT0 = performance.now(), fpsLow = 0, fpsAskedAt = -1e9, fpsNow = 0;
function fpsSample(now) {
  fpsFrames++;
  if (now - fpsT0 < 1000) return;
  fpsNow = fpsFrames * 1000 / (now - fpsT0); fpsFrames = 0; fpsT0 = now;
  if (S.showFps) $('#fps').textContent = `${fpsNow.toFixed(0)} / ${TARGET_FPS} fps`;
  if (document.hidden) return;
  fpsLow = fpsNow < TARGET_FPS * .62 ? fpsLow + 1 : Math.max(0, fpsLow - 1);
  const qi = Q_ORDER.indexOf(S.quality);
  if (fpsLow >= 8 && qi > 0 && now - fpsAskedAt > 120000 && $('#dialog').hidden) {
    fpsAskedAt = now; fpsLow = 0;
    ask(`動作が重くなっています(平均 ${fpsNow.toFixed(0)}fps / 目標 ${TARGET_FPS}fps)。画質を「${QUALITY[Q_ORDER[qi - 1]].label}」に下げますか?`, '下げる', 'このまま')
      .then(ok => { if (ok) { applyQuality(Q_ORDER[qi - 1]); toast(`画質を「${QUALITY[S.quality].label}」にしました`); if (UI.tab === 'other') renderPanel(); } });
  }
}

  noise(dur, o = {}) {

    const t = c.currentTime + (o.at || 0), src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noiseBuf; f.type = o.filter || 'lowpass'; f.frequency.value = o.freq || 800; f.Q.value = o.q || .7;
    g.gain.setValueAtTime(o.vol ?? .2, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.se);
    src.start(t, Math.random() * .5); src.stop(t + dur + .05);
  },
  // 効果音。同じ音の連打は間引く
  play(name, gap = 60) {
    if (!this.ctx || !this.on) return;
    const now = performance.now();
    if (now - (this.last[name] || 0) < gap) return;
    this.last[name] = now;
    const T = (f, d, o) => this.tone(f, d, o);
    switch (name) {
      case 'click': T(1320, .05, { type: 'triangle', vol: .05 }); break;
      case 'open': T(520, .09, { type: 'triangle', vol: .07, to: 780 }); break;
      case 'close': T(700, .08, { type: 'triangle', vol: .06, to: 440 }); break;
      case 'tap': T(900, .04, { type: 'sine', vol: .05 }); break;
      case 'place': this.noise(.18, { freq: 260, vol: .35 }); T(120, .22, { type: 'sine', vol: .25, to: 70 }); T(660, .12, { type: 'triangle', vol: .06, at: .05 }); break;
      case 'remove': this.noise(.25, { freq: 500, vol: .2 }); T(300, .2, { type: 'triangle', vol: .08, to: 120 }); break;
      case 'error': T(196, .09, { type: 'square', vol: .045 }); T(165, .12, { type: 'square', vol: .045, at: .1 }); break;
      case 'good': [784, 988, 1175].forEach((f, i) => T(f, .22, { type: 'triangle', vol: .08, at: i * .07 })); break;
      case 'warn': T(660, .14, { type: 'triangle', vol: .08 }); T(550, .2, { type: 'triangle', vol: .08, at: .12 }); break;
      case 'bad': T(220, .45, { type: 'sawtooth', vol: .06, to: 140 }); T(233, .45, { type: 'sawtooth', vol: .04, to: 147 }); break;
      case 'levelup': [523, 659, 784, 1047].forEach((f, i) => T(f, .25, { type: 'triangle', vol: .07, at: i * .06 })); break;
      case 'quest': T(1047, .3, { type: 'sine', vol: .09 }); T(1568, .4, { type: 'sine', vol: .06, at: .08 }); break;
      case 'coin': T(1319, .08, { type: 'square', vol: .03 }); T(1760, .25, { type: 'square', vol: .03, at: .07 }); break;
      case 'hit': this.noise(.06, { filter: 'bandpass', freq: 1400 + Math.random() * 600, q: 1.5, vol: .12 }); break;
      case 'boss': [392, 494, 587, 784].forEach((f, i) => T(f, .5, { type: 'sawtooth', vol: .04, at: i * .12 })); break;
      case 'dawn': [72, 76, 79, 84].forEach((n, i) => T(mtof(n), 1.2, { type: 'sine', vol: .05, at: i * .18, attack: .02 })); break;
      case 'dusk': [67, 64, 60].forEach((n, i) => T(mtof(n), 1.6, { type: 'sine', vol: .05, at: i * .25, attack: .02 })); break;
      case 'fanfare': [60, 64, 67, 72, 67, 72, 76].forEach((n, i) => T(mtof(n), .35, { type: 'triangle', vol: .09, at: i * .13 })); break;
      case 'over': [67, 63, 60, 55].forEach((n, i) => T(mtof(n), .7, { type: 'triangle', vol: .08, at: i * .3 })); break;
    }
  },
  // 地形ブラシ中は、削る音(フィルター付きノイズ)を鳴らし続ける
  brush(active, tool) {
    const c = this.ctx; if (!c) return;
    if (active && this.on && !this.brushSrc) {
      const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      src.buffer = this.noiseBuf; src.loop = true;
      f.type = 'bandpass'; f.frequency.value = tool === 'lower' ? 260 : tool === 'raise' ? 420 : tool === 'paint' ? 1800 : 700; f.Q.value = .8;
      g.gain.value = 0; g.gain.setTargetAtTime(.09, c.currentTime, .08);
      src.connect(f); f.connect(g); g.connect(this.se); src.start();
      this.brushSrc = src; this.brushGain = g;
    } else if (!active && this.brushSrc) {
      const src = this.brushSrc, g = this.brushGain;
      g.gain.setTargetAtTime(0, c.currentTime, .06); setTimeout(() => { try { src.stop(); } catch (e) {} }, 300);
      this.brushSrc = null;
    }
  },
  // BGM:昼は長調、夜は短調の和音をゆっくり鳴らし、音階からときどき単音をつま弾く
  schedule() {
    const c = this.ctx; if (!c || !this.on || c.state !== 'running' || !G) return;
    const night = G.hour >= 19 || G.hour < 6;
    while (this.next < c.currentTime + 1) {
      const t = this.next, len = 8;
      const DAY = [[48, 55, 64, 67], [45, 52, 60, 64], [41, 48, 57, 60], [43, 50, 59, 62]];
      const NIGHT = [[45, 52, 60, 64], [40, 47, 55, 59], [41, 48, 57, 60], [38, 45, 53, 57]];
      const ch = (night ? NIGHT : DAY)[this.chordIdx++ % 4];
      for (const n of ch) for (const det of [-6, 6]) {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'triangle'; o.frequency.value = mtof(n); o.detune.value = det;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.035, t + 2.5);
        g.gain.setValueAtTime(.035, t + len - 2); g.gain.linearRampToValueAtTime(0, t + len + .5);
        o.connect(g); g.connect(this.bgm); o.start(t); o.stop(t + len + .6);
      }
      const scale = night ? [57, 60, 62, 64, 67, 69, 72] : [60, 62, 64, 67, 69, 72, 74, 76];
      const notes = night ? 3 : 5;
      for (let k = 0; k < notes; k++) {
        if (Math.random() < .3) continue;
        const at = t + k * (len / notes) + Math.random() * .3, n = scale[Math.floor(Math.random() * scale.length)];
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = mtof(n + (night ? 0 : 12));
        g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.05, at + .02); g.gain.exponentialRampToValueAtTime(.0001, at + 2.2);
        o.connect(g); g.connect(this.bgm); o.start(at); o.stop(at + 2.3);
      }
      this.next += len;
    }
  },
};
// カメラの近くで起きた出来事だけ音を鳴らす
function nearCam(x, z, r = 60) { const cp = camera.position; return Math.hypot(x - cp.x, z - cp.z) < r + Cam.dist * .3 && Cam.dist < 160; }
function updateSoundBtn() {
  const b = document.getElementById('btnSound'); if (!b) return;
  b.classList.toggle('dim', !Sound.on);
  b.setAttribute('aria-label', Sound.on ? '音を消す' : '音を出す');
  b.innerHTML = Sound.on ? '<svg class="i" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>'
    : '<svg class="i" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
}
document.addEventListener('pointerdown', () => { if (Sound.on) Sound.init(); }, { capture: true });
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled || !Sound.ctx) return;
  if (b.closest('#tools') || b.id === 'panelClose' || b.dataset.pl === 'ok' || b.dataset.ar === 'ok') return;
  Sound.play('click');
}, { capture: true });

/* ════════════════════════════════════════════
   メインループ
   ════════════════════════════════════════════ */
let lastFrame = performance.now(), uiT = 0;
const MIN_FRAME = TARGET_FPS === 30 ? 1000 / 30 - 4 : 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - lastFrame < MIN_FRAME) return;
  const dt = Math.min(.1, (now - lastFrame) / 1000);
  lastFrame = now;
  simUpdate(dt);
  Cam.update(dt);
  Sky.update((G.hour + (SPEEDS[speedIdx] ? clamp(tickAcc, 0, .999) : 0)) % 24);
  Brush.apply(dt);
  simulateUnits(dt * SPEEDS[speedIdx] * SIM_SCALE, dt);
  if (selection && (selection.kind === 'monster' || selection.kind === 'player')) placeSelRing();
  if (Brush.ring.visible) Brush.updateRing();
  if (selRing.visible) selRing.material.opacity = .7 + Math.sin(now / 250) * .25;
  if (now - Minimap.last > 100) { Minimap.last = now; Minimap.draw(); }
  renderer.render(scene, camera);
  fpsSample(now);
  uiT += dt;
  if (uiT >= .5) { uiT = 0; uiUpdate(); }
}

/* ════════════════════════════════════════════
   起動
   ════════════════════════════════════════════ */
function boot() {
  G = newGame(20260926);
  applyQuality(S.quality);
  Objects.init();
  Monsters.init();
  Place.init();
  AreaEdit.init();
  Players.init();
  Players.reindex();
  Scenery.init();
  Minimap.init();
  Objects.rebuildAll();
  Areas.rebuildAll();
  Quests.rebuildFlags();
  initWorldContent();
  setSpeed(0);
  setMode('view');
  setFollow(null);
  log('サーバー「Arcana Online」を開設しました', 'good');
  log('はじまりの町を中央の島に設置しました');
  log('エリア「はじまりの草原」(Lv1〜5)にスライムが出現しています');
  log(`初期加入者${G.players.length}人がログインしました`, 'good');
  uiUpdate();
  Cam.update(0);
  requestAnimationFrame(frame);
  updateSoundBtn();
  startScreen(true);
}
// 新しい世界の初期加入者とモンスター
function initWorldContent() {
  if (!G.players.length) for (let i = 0; i < 20; i++) Players.join();
  Classes.updatePopularity();
  for (const sp of G.objects) if (sp.type === 'spawn' && !Monsters.count(sp.id)) Monsters.fill(sp, 4);
  Players.updateVis();
}
$('#pickBar').addEventListener('click', e => { if (e.target.closest('[data-pk]')) { const id = Quests.pickFor; setMode('view'); UI.qEdit = id; UI.tab = null; openTab('quest'); } });
boot();

// デバッグ・後続段階用に参照を公開
window.__arcana = { get G() { return G; }, Cam, Terrain, Brush, Minimap, Objects, Monsters, Place, AreaEdit, Areas, Players, PG, Classes, Quests, Econ, Research, Admin, Requests, serialize, deserialize, setMode, setSpeed, applyQuality, toast, heightAt, slopeAt };
})();
