<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07112b">
<title>Luminous Oath</title>
<meta name="description" content="ブラウザで遊べる3DオープンワールドRPG『ルミナス・オース』">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#07112b; --glass:rgba(8,19,46,.78); --glass2:rgba(11,26,62,.93);
  --line:rgba(159,227,255,.26); --lumen:#9fe3ff; --azure:#3f7fe0; --gold:#e6c67a; --gold-d:#a8884a;
  --parch:#eef3fb; --muted:#9fb2d3; --hp:#e0566b; --hp2:#ff9a8a; --mp:#3d9bff; --ok:#6fe0a0; --bad:#ff6b6b;
  --f-logo:'Cinzel','Trajan Pro','Times New Roman',serif;
  --f-jp:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-ui:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --top:calc(14px + env(safe-area-inset-top,0px)); --bot:calc(14px + env(safe-area-inset-bottom,0px));
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;touch-action:none;overscroll-behavior:none;background:var(--ink);color:var(--parch);font-family:var(--f-ui)}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--lumen);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- shared panel ---------- */
.pane{background:var(--glass);border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(230,198,122,.12),0 10px 30px rgba(0,0,0,.35);border-radius:3px;position:relative;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pane::before,.pane::after{content:"";position:absolute;width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.pane::before{top:-4px;left:-4px}.pane::after{bottom:-4px;right:-4px}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#party{position:absolute;left:16px;top:var(--top);display:flex;flex-direction:column;gap:6px;width:236px}
.pm{display:grid;grid-template-columns:34px 1fr;gap:4px 8px;align-items:center;padding:6px 10px 7px 6px}
.pm.lead{padding:8px 10px 9px 8px}
.pm .face{grid-row:span 2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-jp);font-weight:800;font-size:15px;color:#0b1430;border:1.5px solid var(--gold);box-shadow:0 0 10px rgba(159,227,255,.35)}
.pm.down .face{filter:grayscale(1) brightness(.6)}
.pm .nm{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;line-height:1}
.pm .nm b{font-family:var(--f-jp);font-weight:700;font-size:13px;letter-spacing:.04em}
.pm .nm span{color:var(--muted);font-size:10.5px}
.bars{display:flex;flex-direction:column;gap:3px}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:1px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,var(--hp),var(--hp2));transition:transform .15s}
.bar.mp i{background:linear-gradient(90deg,#2a6fe0,var(--mp) 60%,#8fd0ff)}
.bar.xp{height:3px}.bar.xp i{background:linear-gradient(90deg,var(--gold-d),var(--gold))}
.hpnum{font-size:10px;color:var(--muted);text-align:right;margin-top:-1px}
#gold{position:absolute;left:16px;bottom:var(--bot);padding:7px 14px;font-size:13px;display:flex;gap:14px;align-items:center}
#gold b{color:var(--gold);font-family:var(--f-logo);font-weight:700;font-size:15px}
#gold small{color:var(--muted)}

#tr{position:absolute;right:16px;top:var(--top);width:196px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#mmwrap{width:176px;height:176px;border-radius:50%;position:relative;box-shadow:0 0 0 2px var(--gold-d),0 0 0 5px rgba(8,19,46,.7),0 0 0 6px var(--line),0 8px 24px rgba(0,0,0,.5)}
#minimap{width:176px;height:176px;border-radius:50%;display:block}
#mmN{position:absolute;left:50%;top:-9px;width:18px;height:18px;margin-left:-9px;background:var(--ink);border:1px solid var(--gold);border-radius:50%;font:700 10px/16px var(--f-logo);text-align:center;color:var(--gold)}
#place{font-family:var(--f-jp);font-weight:700;font-size:14px;text-align:right;text-shadow:0 1px 4px #000;letter-spacing:.06em}
#clock{font-size:11px;color:var(--muted);text-shadow:0 1px 3px #000;margin-top:-6px}
#quest{width:196px;padding:9px 12px 10px}
#quest .qh{font-family:var(--f-logo);font-size:9.5px;letter-spacing:.2em;color:var(--gold)}
#quest .qt{font-family:var(--f-jp);font-weight:700;font-size:13.5px;margin:3px 0 4px}
#quest .qd{font-size:11.5px;line-height:1.55;color:#d7e3f7}
#quest .qs{font-size:10.5px;color:var(--muted);margin-top:6px;border-top:1px solid var(--line);padding-top:5px;line-height:1.6}

#skills{position:absolute;left:50%;bottom:var(--bot);transform:translateX(-50%);display:flex;gap:8px;align-items:flex-end}
.sk{width:54px;height:54px;border-radius:4px;position:relative;display:grid;place-items:center;overflow:hidden;background:linear-gradient(160deg,rgba(40,80,150,.7),rgba(8,19,46,.9));border:1px solid var(--line)}
.sk svg{width:28px;height:28px}
.sk .k{position:absolute;left:4px;top:2px;font:700 10px var(--f-logo);color:var(--gold)}
.sk .c{position:absolute;right:4px;bottom:2px;font-size:9.5px;color:var(--lumen)}
.sk .cd{position:absolute;inset:0;background:conic-gradient(rgba(3,8,22,.78) calc(var(--cd,0)*360deg),transparent 0)}
.sk.nomp{filter:saturate(.3) brightness(.7)}
.sk.ult{width:66px;height:66px;border-color:var(--gold)}
.sk.ult.ready{box-shadow:0 0 18px var(--gold),inset 0 0 14px rgba(230,198,122,.6);animation:pulse 1.2s ease-in-out infinite}
.sk.ult .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(230,198,122,.55),rgba(159,227,255,.25));height:calc(var(--u,0)*100%)}
@keyframes pulse{50%{box-shadow:0 0 30px var(--gold),inset 0 0 20px rgba(230,198,122,.8)}}
.sklbl{position:absolute;bottom:calc(100% + 4px);left:0;right:0;text-align:center;font-size:9.5px;color:var(--muted);white-space:nowrap}

#prompt{position:absolute;left:50%;bottom:calc(var(--bot) + 92px);transform:translateX(-50%);padding:7px 16px;font-size:13px;display:flex;gap:10px;align-items:center;white-space:nowrap}
.kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border:1px solid var(--gold);border-radius:3px;font:700 11px var(--f-logo);color:var(--gold)}
#bossbar{position:absolute;left:50%;top:calc(var(--top) + 6px);transform:translateX(-50%);width:min(520px,calc(100% - 520px));min-width:260px;text-align:center}
#bossbar .bn{font-family:var(--f-jp);font-weight:800;font-size:16px;letter-spacing:.12em;text-shadow:0 0 12px rgba(255,120,120,.6),0 2px 4px #000}
#bossbar .bb{height:10px;margin-top:5px;background:rgba(0,0,0,.55);border:1px solid rgba(255,200,180,.5);position:relative}
#bossbar .bb i{position:absolute;inset:1px;transform-origin:left;background:linear-gradient(90deg,#8a1c2e,#e0566b 70%,#ffb199)}
#toasts{position:absolute;left:16px;top:calc(var(--top) + 300px);display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.toast{padding:6px 12px;font-size:12.5px;background:linear-gradient(90deg,rgba(8,19,46,.9),rgba(8,19,46,0));border-left:2px solid var(--gold);animation:tin .3s ease-out}
.toast.gold{border-color:var(--gold);color:#ffe9b0}.toast.cyan{border-color:var(--lumen)}.toast.red{border-color:var(--bad)}
@keyframes tin{from{transform:translateX(-12px);opacity:0}}
#banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .8s}
#banner.on{opacity:1}
#banner .b1{font-family:var(--f-logo);font-size:11px;letter-spacing:.5em;color:var(--gold)}
#banner .b2{font-family:var(--f-jp);font-weight:800;font-size:clamp(26px,4vw,42px);letter-spacing:.18em;text-shadow:0 0 24px rgba(159,227,255,.55),0 3px 8px rgba(0,0,0,.7);white-space:nowrap;padding:6px 0}
#banner .ln{height:1px;width:min(420px,80vw);margin:0 auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#floaters,#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;font-family:var(--f-logo);font-weight:900;font-size:18px;text-shadow:0 2px 3px #000,0 0 6px rgba(0,0,0,.6);transform:translate(-50%,-50%);white-space:nowrap}
.fl.crit{font-size:26px;color:#ffe08a}.fl.heal{color:var(--ok)}.fl.hurt{color:#ff8080;font-size:16px}.fl.info{font-family:var(--f-jp);font-size:14px;color:var(--lumen)}
.ebar{position:absolute;width:56px;transform:translate(-50%,-100%);font-size:10px;text-align:center;color:#ffd7d7;text-shadow:0 1px 2px #000;white-space:nowrap}
.ebar div{height:4px;background:rgba(0,0,0,.6);margin-top:2px;border:1px solid rgba(0,0,0,.5)}
.ebar i{display:block;height:100%;background:#e0566b;transform-origin:left}
.nlabel{position:absolute;transform:translate(-50%,-100%);font-family:var(--f-jp);font-weight:700;font-size:12px;color:#fff;text-shadow:0 1px 3px #000,0 0 6px rgba(0,0,0,.8);white-space:nowrap}
.nlabel small{display:block;text-align:center;font-family:var(--f-ui);font-weight:400;font-size:10px;color:var(--gold)}
#topbtns{position:absolute;right:222px;top:var(--top);display:flex;gap:6px;pointer-events:auto}
.tb{height:30px;padding:0 10px;font-size:11.5px;display:flex;gap:6px;align-items:center;cursor:pointer;background:var(--glass);border:1px solid var(--line);border-radius:3px}
.tb:hover{border-color:var(--gold)}
#hint{position:absolute;left:50%;bottom:calc(var(--bot) + 138px);transform:translateX(-50%);font-size:12px;color:var(--muted);text-shadow:0 1px 3px #000;white-space:nowrap;transition:opacity 1s}

/* touch */
#touch{position:absolute;inset:0;pointer-events:none}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:1.5px solid rgba(159,227,255,.35);background:rgba(8,19,46,.25);transform:translate(-50%,-50%);display:none}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(159,227,255,.35);border:1.5px solid var(--lumen)}
#tbtns{position:absolute;right:16px;bottom:calc(var(--bot) + 4px);width:210px;height:200px;pointer-events:none}
.tbn{position:absolute;pointer-events:auto;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-jp);background:rgba(8,19,46,.55);border:1.5px solid var(--line);touch-action:none}
.tbn.big{width:78px;height:78px;right:0;bottom:0;border-color:var(--gold);font-size:15px}
.tbn.s{width:50px;height:50px}

/* dialog */
#dialog{position:absolute;left:50%;bottom:calc(var(--bot) + 10px);transform:translateX(-50%);width:min(760px,calc(100% - 32px));padding:18px 24px 20px;background:var(--glass2);cursor:pointer;z-index:5}
#dialog .dn{position:absolute;top:-15px;left:20px;padding:4px 16px;font-family:var(--f-jp);font-weight:800;font-size:14px;letter-spacing:.1em;background:linear-gradient(90deg,#1b3a7a,#0e2150);border:1px solid var(--gold);color:#fff}
#dialog .dt{font-family:var(--f-jp);font-weight:500;font-size:clamp(14px,1.6vw,17px);line-height:1.85;min-height:3.7em;letter-spacing:.03em}
#dialog .dc{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#dialog .dc button{padding:8px 16px;background:rgba(63,127,224,.2);border:1px solid var(--line);border-radius:2px;cursor:pointer;font-size:13px}
#dialog .dc button:hover{border-color:var(--gold);background:rgba(63,127,224,.35)}
#dialog .dm{position:absolute;right:18px;bottom:8px;color:var(--gold);font-size:11px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}

/* panels */
#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100% - 32px));max-height:calc(100% - 60px);display:flex;flex-direction:column;background:var(--glass2);z-index:6}
#panel header{display:flex;align-items:center;gap:6px;padding:14px 18px 0;flex-wrap:wrap}
#panel h2{font-family:var(--f-jp);font-weight:800;font-size:19px;letter-spacing:.12em;margin:0 12px 0 0}
#panel .tabs{display:flex;gap:4px;flex-wrap:wrap}
#panel .tabs button{padding:6px 12px;font-size:12.5px;background:none;border:1px solid transparent;border-bottom-color:var(--line);cursor:pointer;color:var(--muted)}
#panel .tabs button.on{color:var(--parch);border-color:var(--gold);border-bottom-color:transparent}
#panel .x{margin-left:auto;width:32px;height:32px;border:1px solid var(--line);background:none;cursor:pointer;font-size:16px}
#panel .body{padding:16px 18px 18px;overflow:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{border:1px solid var(--line);padding:10px 12px;background:rgba(255,255,255,.03)}
.card h3{margin:0 0 6px;font-family:var(--f-jp);font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.card h3 small{font-family:var(--f-ui);font-size:11px;color:var(--gold);font-weight:500}
.stat{display:flex;justify-content:space-between;font-size:12px;line-height:1.75;color:#d7e3f7}
.stat b{font-variant-numeric:tabular-nums;font-weight:500}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .gr{flex:1;min-width:0}
.row .gr b{font-family:var(--f-jp);font-size:14.5px}
.row .gr p{margin:2px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5}
.row .pr{font-family:var(--f-logo);color:var(--gold);font-weight:700;min-width:70px;text-align:right}
.btn{padding:7px 14px;border:1px solid var(--gold);background:rgba(230,198,122,.1);cursor:pointer;border-radius:2px;font-size:12.5px;white-space:nowrap}
.btn:hover{background:rgba(230,198,122,.25)}.btn:disabled{opacity:.35;cursor:not-allowed}
.qitem{padding:10px 0;border-bottom:1px solid var(--line)}
.qitem b{font-family:var(--f-jp);font-size:14.5px}.qitem p{margin:3px 0 0;font-size:12px;color:#cdd9ee;line-height:1.6}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border:1px solid var(--line);margin-left:6px;color:var(--muted);vertical-align:2px}
.tag.m{border-color:var(--gold);color:var(--gold)}.tag.d{border-color:var(--ok);color:var(--ok)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;align-items:center}
.muted{color:var(--muted);font-size:12px;line-height:1.7}

#mapview{position:absolute;inset:0;background:rgba(4,10,26,.82);display:grid;place-items:center;z-index:6}
#mapview .mf{position:relative;padding:12px}
#bigmap{display:block;max-width:calc(100vw - 56px);max-height:calc(100vh - 110px)}
#mapview .mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:10px}
#mapview .mh b{font-family:var(--f-logo);letter-spacing:.3em;color:var(--gold);font-size:13px}
#mapview .mh span{font-size:11px;color:var(--muted)}

/* screens */
.screen{position:absolute;inset:0;z-index:10}
#title{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 16px calc(7vh + env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at 50% 38%,transparent 30%,rgba(4,10,30,.55) 100%),linear-gradient(180deg,rgba(4,10,30,.1),transparent 40%,rgba(4,10,30,.6))}
#logo{position:absolute;right:max(16px,5vw);top:max(calc(20px + env(safe-area-inset-top,0px)),7vh);text-align:center;width:min(640px,calc(100% - 32px))}
#logo svg.star{position:absolute;left:50%;top:50%;width:min(300px,48vw);transform:translate(-50%,-58%);opacity:.95;filter:drop-shadow(0 0 16px rgba(120,200,255,.9))}
#logo h1{position:relative;margin:0;font-family:var(--f-logo);font-weight:900;font-size:clamp(34px,7.2vw,86px);letter-spacing:.02em;line-height:1;color:#fff;text-shadow:0 0 18px rgba(120,190,255,.8),0 0 2px #fff,0 4px 14px rgba(0,20,60,.8)}
#logo h1 span{font-size:1.18em}
#logo .kana{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;font-family:var(--f-jp);font-weight:700;font-size:clamp(14px,1.9vw,21px);letter-spacing:.3em;color:#e9f6ff;text-shadow:0 0 10px rgba(120,190,255,.9)}
#logo .kana::before,#logo .kana::after{content:"";height:1px;flex:1;max-width:190px;background:linear-gradient(90deg,transparent,#cfeaff)}
#logo .kana::after{transform:scaleX(-1)}
#tag{position:absolute;left:max(16px,6vw);top:max(calc(24px + env(safe-area-inset-top,0px)),8vh);writing-mode:vertical-rl;font-family:var(--f-jp);font-weight:800;font-size:clamp(20px,2.8vw,34px);letter-spacing:.22em;line-height:1.6;color:#fff;text-shadow:0 0 14px rgba(0,30,80,.9),0 2px 6px rgba(0,0,0,.6)}
#menu{display:flex;flex-direction:column;gap:6px;align-items:center}
#menu button{min-width:230px;padding:11px 26px;background:linear-gradient(90deg,transparent,rgba(8,19,46,.72) 20%,rgba(8,19,46,.72) 80%,transparent);border:none;border-top:1px solid rgba(230,198,122,.35);border-bottom:1px solid rgba(230,198,122,.35);font-family:var(--f-jp);font-weight:700;font-size:16px;letter-spacing:.3em;cursor:pointer;transition:letter-spacing .25s,color .25s}
#menu button:hover:not(:disabled){letter-spacing:.42em;color:var(--gold)}
#menu button:disabled{opacity:.4;cursor:default}
#menu .sub{font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.08em;text-shadow:0 1px 3px #000;text-align:center}
#intro{display:grid;place-items:center;background:#040a1c;cursor:pointer;padding:0 16px}
#intro p{font-family:var(--f-jp);font-weight:500;font-size:clamp(16px,2.2vw,22px);line-height:2.1;letter-spacing:.12em;text-align:center;max-width:36em;opacity:0;transition:opacity 1.2s}
#intro p.on{opacity:1}
#intro small{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:var(--muted);font-size:11px;letter-spacing:.2em}
#dead,#ending{display:grid;place-items:center;text-align:center;padding:0 16px}
#dead{background:radial-gradient(circle,rgba(40,0,10,.55),rgba(0,0,0,.85))}
#ending{background:radial-gradient(circle,rgba(20,50,110,.6),rgba(3,8,24,.94))}
.big{font-family:var(--f-jp);font-weight:800;font-size:clamp(26px,4vw,44px);letter-spacing:.2em;margin:0 0 12px}
.big.en{font-family:var(--f-logo);letter-spacing:.12em}
#fade{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .6s;z-index:20}
#fade.dark{background:#02040c}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--ink);z-index:30;font-family:var(--f-jp);letter-spacing:.3em;color:var(--muted)}

@media (max-width:760px){
  #party{width:176px;gap:4px}
  .pm{padding:4px 8px 5px 4px;grid-template-columns:26px 1fr}
  .pm .face{width:26px;height:26px;font-size:12px}
  .pm:not(.lead) .hpnum{display:none}
  #tr{width:132px}
  #mmwrap,#minimap{width:118px;height:118px}
  #quest{width:150px;padding:7px 9px}
  #quest .qd{font-size:10.5px}#quest .qs{display:none}
  #topbtns{right:auto;left:16px;top:auto;bottom:calc(var(--bot) + 42px)}
  #skills{left:16px;transform:none;bottom:calc(var(--bot) + 80px);gap:5px}
  #bossbar{width:calc(100% - 360px);min-width:150px}
  #toasts{top:calc(var(--top) + 160px)}
  #hint{display:none}
}
body.touch #skills{display:none}
button,.tb,.pm,#mmwrap,#dialog{touch-action:manipulation}
#panel .body{touch-action:pan-y}
#mmwrap{cursor:pointer;pointer-events:auto}
.pm{pointer-events:auto;cursor:pointer;transition:box-shadow .2s}
.pm.ctrl{box-shadow:inset 0 0 0 1px rgba(230,198,122,.5),0 0 0 1.5px var(--gold),0 0 14px rgba(230,198,122,.35)}
.pm.ctrl .nm b::after{content:" ◆";color:var(--gold);font-size:9px}

function castFrom(m){return new THREE.Vector3(m.pos.x+Math.sin(m.rotY)*.7,m.pos.y+1.4,m.pos.z+Math.cos(m.rotY)*.7);}
function startSwing(c){player.combo=c;player.atkDur=player.atkT=ATK[c].dur;player.hitDone=false;faceSoft();sfx('swing');player.vel.x+=Math.sin(player.rotY)*4;player.vel.z+=Math.cos(player.rotY)*4;}
const BASIC={celes:{cd:.5,col:0xe0f6ff},rina:{cd:.72,col:0xff7a3a},kohaku:{cd:.34,col:0xfff0c0}};
function playerAttack(){if(!canAct())return;if(player.key!=='allen'){rangedBasic();return;}if(player.spinT>0)return;if(player.atkT>0){if(player.atkT<player.atkDur*.6&&player.combo<2)player.queued=true;return;}startSwing(0);}
function rangedBasic(){
  if(player.atkT>0)return;const b=BASIC[player.key];player.atkT=player.atkDur=b.cd;player.hitDone=true;player.castT=.22;
  const e=faceSoft(26),from=castFrom(player),dir=dirOf(player);
  if(player.key==='celes'){shoot({from,team:'party',target:e,dir,dmg:player.mag*1.35,color:b.col,speed:26,homing:6,src:player,size:.9,trail:.5,life:1.4});sfx('magic');}
  if(player.key==='rina'){shoot({from,team:'party',target:e,dir,dmg:player.mag*1.6,aoe:2.4,color:b.col,speed:22,homing:4,src:player,size:1.1,trail:.8,life:1.5});sfx('fire');}
  if(player.key==='kohaku'){shoot({from,team:'party',target:e,dir,dmg:player.atk*1.3,color:b.col,speed:44,homing:7,src:player,arrow:true,trail:.25,kb:1,life:1.2});sfx('arrow');}
}
function meleeHit(c){
  const a=ATK[c],fx=Math.sin(player.rotY),fz=Math.cos(player.rotY);let any=false;
  for(const e of enemies){if(e.dead||e.world!==curWorld())continue;const dx=e.pos.x-player.pos.x,dz=e.pos.z-player.pos.z,d=Math.hypot(dx,dz);
    const reach=3.2+e.rad*(e.big?1:.9);if(d>reach)continue;if(Math.abs(e.pos.y+(e.fly||0)-player.pos.y)>(e.big?9:4))continue;
    if(d>1&&(dx*fx+dz*fz)/d<.15)continue;dmgEnemy(e,player.atk*a.mult,player,a.kb);any=true;}
  for(let i=0;i<14;i++){const ang=player.rotY+(i/13-.5)*2.2;emit(player.pos.x+Math.sin(ang)*2.2,player.pos.y+1.1+(c===2?-.3:0)+Math.sin(i*.5)*.2,player.pos.z+Math.cos(ang)*2.2,1,{c:c===2?0xffe08a:0xaee8ff,sp:.5,life:.25,s:.55});}
  if(any&&c===2)G.shake=Math.max(G.shake,.15);
}

// ================================================================ shards
const shardObjs=[];
function spawnShard(i,x,z){
  if(G.shards[i]||shardObjs.some(s=>s.i===i))return;
  const s=SHARDS[i];x=x===undefined?s.x:x;z=z===undefined?s.z:z;
  const seal=i>=5;const g=new THREE.Group();const c=new THREE.Mesh(new THREE.OctahedronGeometry(.7),new THREE.MeshLambertMaterial({color:seal?0xe0c0ff:0xbff0ff,emissive:seal?0x6a2aa0:0x3aa0e0}));c.scale.y=1.7;g.add(c);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:seal?0xc090ff:0x9fe3ff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));sp.scale.set(5,5,1);g.add(sp);
  g.position.set(x,groundH(x,z)+1.6,z);scene.add(g);shardObjs.push({i,g,c,pos:g.position});
}
function takeShard(o){
  G.shards[o.i]=1;scene.remove(o.g);shardObjs.splice(shardObjs.indexOf(o),1);sfx('shard');
  emit(o.pos.x,o.pos.y,o.pos.z,80,{c:0x9fe3ff,sp:7,life:1.2,s:.7,up:2});
  if(o.i>=5){const n=cnt2();banner('ECLIPSE SEAL',`蝕の封印 ${n} / 5`);if(G.main===10&&n>=5)setMain(11);}
  else{const n=cnt1();banner('OATH SHARD',`誓約の欠片 ${n} / 5`);if(G.main===3&&n>=5)setMain(4);}
  saveGame(true);
}

// ================================================================ quests
function cnt1(){let n=0;for(let i=0;i<5;i++)n+=G.shards[i]?1:0;return n;}
function cnt2(){let n=0;for(let i=5;i<10;i++)n+=G.shards[i]?1:0;return n;}
function setMain(n){G.main=n;const q=questInfo();banner('QUEST',q[0]);if(n===3&&cnt1()>=5)G.main=4;if(n===10&&cnt2()>=5)G.main=11;saveGame(true);}
function questInfo(){
  if(G.main>=13)return questInfo3();
  switch(G.main){
    case 0:return['草原の異変','エルムの村のエルダ村長と話す'];
    case 1:return G.slimeKills<5?['草原の異変',`村の南の草原でスライムを倒す（${G.slimeKills}/5）`]:['草原の異変','エルダ村長に報告する'];
    case 2:return['王都へ','湖の東の街道を進み、王都ルミナリアの騎士団長レオニスに会う'];
    case 3:return['誓約の欠片',`各地の守護者を倒し、欠片を集める（${cnt1()}/5）`];
    case 4:return['光の転移陣','王都の広場で大賢者オルフェに欠片を届ける'];
    case 5:return['蒼穹の決戦','王都の転移陣から天空の祭壇へ向かい、蒼穹竜ヴェルザードを討つ'];
    case 6:return['第二章：黄昏の大陸','王都の大賢者オルフェに報告する'];
    case 7:return['黄昏の大陸',player.pos.x>1000?'砂上都市アル＝ミラージュの太守ラシードに会う':'王都の転移陣、または東の関所から峠道を越えて黄昏の大陸へ'];
    case 8:return G.scKills<6?['砂の街の危機',`町の南の砂漠でデススコーピオンを倒す（${G.scKills}/6）`]:['砂の街の危機','太守ラシードに報告する'];
    case 9:return['月影の騎士','宮殿の前にいる月影の騎士シリウスと話す'];
    case 10:return['蝕の封印',`五体の守護者を倒し、封印を集める（${cnt2()}/5）`];
    case 11:return['結界を断て','月影の騎士シリウスに封印を届ける'];
    case 12:return['黄昏の玉座','北の黄昏の玉座で蝕の魔王ゼルヴァーンを討つ'];
    default:return['誓いの果てに','二つの大陸を自由に旅しよう'];
  }
}
function questTarget(){
  const N=id=>npcs.find(n=>n.id===id).pos;const inW2=player.pos.x>300;
  const shardT=(a,b)=>{let best=null,bd=1e9;for(let i=a;i<b;i++){if(G.shards[i])continue;const s=SHARDS[i],d=Math.hypot(s.x-player.pos.x,s.z-player.pos.z);if(d<bd){bd=d;best={x:s.x,y:groundH(s.x,s.z),z:s.z};}}return best;};
  const portal={x:anim.portal.x,y:CAP.h,z:anim.portal.z};
  if(G.inSky)return null;
  if(G.main>=13)return questTarget3(N,portal);
  switch(G.main){
    case 0:return N('elder');
    case 1:return G.slimeKills<5?{x:-40,y:groundH(-40,195),z:195}:N('elder');
    case 2:return N('leonis');
    case 3:return shardT(0,5);
    case 4:return N('orphe');
    case 5:return G.dragonDead?null:portal;
    case 6:return inW2?{x:anim.portal2.x,y:T2.h,z:anim.portal2.z}:N('orphe');
    case 7:return inW2?N('rashid'):portal;
    case 8:return !inW2?portal:G.scKills<6?{x:W2.cx-60,y:groundH(W2.cx-60,W2.cz+175),z:W2.cz+175}:N('rashid');
    case 9:return inW2?N('sirius'):portal;
    case 10:return inW2?shardT(5,10):portal;
    case 11:return inW2?N('sirius'):portal;
    case 12:return inW2?{x:THRONE.x,y:THRONE.h,z:THRONE.z}:portal;
  }
  return null;
}

// ---- dialog
const dlg={lines:null,i:0,shown:0,full:'',done:null,choosing:false};
function dialog(lines,done){document.body.classList.add('dlg');dlg.lines=lines;dlg.i=0;dlg.done=done||null;G.prevState=G.state==='dialog'?G.prevState:G.state;G.state='dialog';$('#dialog').hidden=false;showLine();exitPointerLock();}
function showLine(){const l=dlg.lines[dlg.i];$('#dialog .dn').textContent=l.n||'';$('#dialog .dn').hidden=!l.n;dlg.full=l.t;dlg.shown=0;$('#dialog .dt').textContent='';const dc=$('#dialog .dc');dc.innerHTML='';dlg.choosing=false;$('#dialog .dm').hidden=true;}
function dialogTick(dt){if(G.state!=='dialog'||!dlg.lines)return;if(dlg.shown<dlg.full.length){dlg.shown=Math.min(dlg.full.length,dlg.shown+dt*48);$('#dialog .dt').textContent=dlg.full.slice(0,Math.floor(dlg.shown));if(dlg.shown>=dlg.full.length)lineDone();}}
function lineDone(){const l=dlg.lines[dlg.i];$('#dialog .dt').textContent=dlg.full;dlg.shown=dlg.full.length;
  if(l.c){dlg.choosing=true;const dc=$('#dialog .dc');dc.innerHTML='';l.c.forEach((c,k)=>{const b=document.createElement('button');b.type='button';b.textContent=`${k+1}. ${c.t}`;b.onclick=ev=>{ev.stopPropagation();choose(k);};dc.appendChild(b);});}
  else $('#dialog .dm').hidden=false;}
function choose(k){const l=dlg.lines[dlg.i];if(!l||!l.c||!l.c[k])return;sfx('ui');closeDialog();l.c[k].f&&l.c[k].f();}
function advance(){if(G.state!=='dialog')return;if(dlg.shown<dlg.full.length){lineDone();return;}if(dlg.choosing)return;sfx('ui');dlg.i++;if(dlg.i>=dlg.lines.length){const d=dlg.done;closeDialog();d&&d();}else showLine();}
function closeDialog(){document.body.classList.remove('dlg');$('#dialog').hidden=true;dlg.lines=null;if(G.state==='dialog')G.state='play';}

function buildNPCs(){

// ================================================================ interaction
let interactTarget=null;
function findInteract(){
  let best=null,bd=3.6;
  for(const n of npcs){if(G.inSky)break;if(!npcOn(n))continue;const d=d2(n.pos,player.pos);if(d<bd){bd=d;best={k:'npc',o:n,label:`${n.name}と話す`};}}
  for(const s of shardObjs){if(G.inSky)break;const d=d2(s.pos,player.pos);if(d<3.2){best={k:'shard',o:s,label:s.i>=5?'蝕の封印を拾う':'誓約の欠片を拾う'};}}
  if(!G.inSky&&Math.hypot(anim.portal.x-player.pos.x,anim.portal.z-player.pos.z)<4.2)best={k:'portal',label:G.main>=7?'転移陣を使う':G.main>=5?'天空の祭壇へ転移する':'転移陣を調べる'};
  if(!G.inSky&&Math.hypot(anim.portal2.x-player.pos.x,anim.portal2.z-player.pos.z)<4.2)best={k:'portal2',label:'転移陣で王都へ戻る'};
  if(G.inSky&&Math.hypot(anim.skyPortal.x-player.pos.x,anim.skyPortal.z-player.pos.z)<3.6)best={k:'return',label:'王都へ戻る'};
  return c3FindInteract(best);
}
function interact(){
  if(!canAct())return;const t=interactTarget;if(!t)return;
  if(c3Interact(t))return;
  if(t.k==='npc'){t.o.rotY=Math.atan2(player.pos.x-t.o.pos.x,player.pos.z-t.o.pos.z);player.rotY=Math.atan2(t.o.pos.x-player.pos.x,t.o.pos.z-player.pos.z);t.o.talk();}
  if(t.k==='shard')takeShard(t.o);
  if(t.k==='portal'){if(G.main<5)dialog([{n:'',t:'古い魔法陣が刻まれている。今は光を失っているようだ……。'}]);
    else if(G.main<7)goSky(true);
    else dialog([{n:'',t:'転移陣が淡く輝いている。どこへ向かう？',c:[{t:'天空の祭壇',f:()=>goSky(true)},{t:'黄昏の大陸ノクティス',f:()=>goW2(true)},...(G.c3.arrived?[{t:'北の大地ノルデン',f:()=>goTown('norden')}]:[]),{t:'やめる',f:null}]}]);}
  if(t.k==='portal2'){if(G.c3.arrived)dialog([{n:'',t:'転移陣が淡く輝いている。どこへ向かう？',c:[{t:'王都ルミナリア',f:()=>goW2(false)},{t:'北の大地ノルデン',f:()=>goTown('norden')},{t:'やめる',f:null}]}]);else goW2(false);}
  if(t.k==='return')goSky(false);
}

const SLOT_KEY=i=>`luminous-oath-slot-${i}`;
function sumOf(b){let h=0;for(let i=0;i<b.length;i++)h=(Math.imul(h,31)+b.charCodeAt(i))>>>0;return(h%65536).toString(16).toUpperCase().padStart(4,'0');}
function encodeSave(o){const b=btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');return`LO2-${b}-${sumOf(b)}`;}
function decodeSave(code){const c=String(code||'').replace(/\s+/g,'');const m=c.match(/^LO2-([A-Za-z0-9_-]+)-([0-9A-Fa-f]{4})$/);if(!m)throw new Error('コードの形式が違います（LO2- で始まる文字列を貼り付けてください）');
  if(sumOf(m[1])!==m[2].toUpperCase())throw new Error('コードが途中で欠けているか、書き換えられています');
  let s=m[1].replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';let o;try{o=JSON.parse(decodeURIComponent(escape(atob(s))));}catch(e){throw new Error('コードを読み取れませんでした');}
  if(!o||typeof o.lvl!=='number'||!Array.isArray(o.pos))throw new Error('冒険の記録が含まれていません');return o;}
function slotInfo(s){return`Lv ${s.lvl}　${regionAt(s.pos[0],s.pos[1])}　${(()=>{const sv=G.main;G.main=s.main;const q=questInfo()[0];G.main=sv;return q;})()}`;}
function readSlot(i){try{const v=JSON.parse(lsGet(SLOT_KEY(i))||'null');return v&&v.s?v:null;}catch(e){return null;}}
function loadData(s){closePanel();c3Cleanup();panelFromTitle=false;for(const id of['#title','#ending','#dead','#intro'])$(id).hidden=true;
  for(const e of enemies.slice())if(e.boss||e.world==='sky'||e.summoner)removeEnemy(e);G.inSky=false;G.bossActive=false;G.bossE=null;
  resetGame();applySave(s);beginPlay(false);saveGame(true);toast('冒険の記録を読み込んだ','cyan');}
function copyText(t,ta){const done=()=>toast('コードをコピーしました','cyan');try{navigator.clipboard.writeText(t).then(done,()=>{ta.focus();ta.select();toast('コードを選択しました。長押し（Ctrl+C）でコピーしてください');});}catch(e){ta.focus();ta.select();}}
function renderSaveTab(body,fromTitle){
  const h=(t)=>{const d=document.createElement('div');d.className='hsec';d.textContent=t;body.appendChild(d);};
  if(!fromTitle){h('セーブスロット');
    for(let i=1;i<=3;i++){const v=readSlot(i);const r=document.createElement('div');r.className='slot';r.innerHTML='<div class="si"><b></b><p></p></div><div class="sb"></div>';
      r.querySelector('b').textContent=`スロット ${i}`;r.querySelector('p').textContent=v?`${slotInfo(v.s)}　─　${new Date(v.t).toLocaleString('ja-JP')}`:'空き';
      const sb=r.querySelector('.sb');const btn=(l,f,dis)=>{const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=l;b.disabled=!!dis;b.onclick=f;sb.appendChild(b);};
      btn('保存',()=>{const ok=lsSet(SLOT_KEY(i),JSON.stringify({t:Date.now(),s:snapshot()}));toast(ok?`スロット ${i} に保存しました`:'この環境では保存できませんでした',ok?'cyan':'red');sfx('ui');openMenu();});
      btn('読込',()=>loadData(v.s),!v);btn('削除',()=>{try{localStorage.removeItem(SLOT_KEY(i));}catch(e){}openMenu();},!v);body.appendChild(r);}
    const p=document.createElement('p');p.className='muted';p.textContent='スロットはこのブラウザの中にだけ保存されます。別の端末やブラウザに持ち出すときは、下のセーブコードを使ってください。';body.appendChild(p);

function updStealth(dt,s){const K=TRIAL.kohaku,p=player.pos,hidden=KBUSH.some(b=>Math.hypot(p.x-b[0],p.z-b[1])<1.9),run=(keys.shift||joy.run)&&player.mv>.3;

    if(on&&db<300){anim.bliz.g.children.forEach((s,i)=>{s.position.x+=Math.sin(t*.7+i)*dt*3;s.material.rotation+=dt*.1;});if(db<110&&R()<.9)emit(BLIZ.x+(R()-.5)*60,groundH(BLIZ.x,BLIZ.z)+2+R()*20,BLIZ.z+(R()-.5)*20,2,{c:0xffffff,dir:[1,-.3,.4],spread:.6,sp:14,life:1.6,s:.6,drag:.99});
      if(G.state==='play'&&inPass2(p.x,p.z,50)&&p.z<-280&&p.z>-300&&t>(G.blizT||0)){G.blizT=t+6;toast('猛吹雪が吹き荒れていて、これ以上は進めない……','red');}}}
  if(!w3G.visible)return;
  for(const e of anim.echoes){const on=G.main>=16&&!c.echoes[e.i]&&!G.echoOn;e.g.visible=on;if(on){e.g.rotation.y+=dt*.8;e.g.position.y=e.y+Math.sin(t*2+e.i)*.18;e.beam.material.opacity=.14+Math.sin(t*2.5+e.i)*.06;if(R()<.3)emit(e.x+(R()-.5)*1.4,e.y-1+R()*2,e.z+(R()-.5)*1.4,1,{c:0xcfeaff,sp:.4,life:1.4,s:.35,up:.8});}}
  for(const l of anim.letters){const on=G.side.hilda===1&&!c.letters[l.i];l.g.visible=on;if(on){l.g.rotation.y+=dt;l.g.position.y=l.y+Math.sin(t*2.2+l.i)*.1;}}
  const cr=anim.crystal;if(cr){const free=c.ending===1;cr.g.visible=!free;if(!free){cr.cr.rotation.y+=dt*.15;cr.sp.material.opacity=.6+Math.sin(t*1.5)*.15;cr.pil.material.opacity=c.ending===2?.24:.14+Math.sin(t)*.04;
    if(c.ending===2&&!cr.gold){cr.gold=1;cr.cm.color.set(0xffefc0);cr.cm.emissive.set(0x6a4a10);cr.sp.material.color.set(0xffd890);cr.pil.material.color.set(0xffe7a6);}}}
  if(anim.astStatue)anim.astStatue.visible=!c.astraeaDead&&!G.astraeaFight;if(anim.w3S)anim.w3S.visible=c.ending!==1;
  if(anim.court){anim.court.rune.rotation.z+=dt*.12;anim.court.bar.material.opacity=.05+Math.sin(t*3)*.02;}
  for(const k in anim.tgates){const g=anim.tgates[k],done=c.hearts[k];g.m.opacity=G.main>=16?(done?.35:.65+Math.sin(t*3)*.25):.15;g.sp.material.opacity=G.main>=16&&!done?.5+Math.sin(t*3)*.2:.12;}
  for(const q of anim.pillars){const on=q.lit&&G.solo&&G.solo.w==='celes';q.cm.emissive.setHex(on?q.col:0x111111);q.sp.material.opacity=on?.85:0;q.cr.rotation.y+=dt*(on?2:.4);}
  if(anim.starPlate)anim.starPlate.rotation.z+=dt*.05;
  if(anim.brazier){const b=anim.brazier,s=G.solo&&G.solo.w==='rina'?G.solo.br:null,k=s?clamp(s.hp/s.maxHp,0,1):1;b.fl.scale.set(1.2*(.4+.6*k),1.6*(.4+.6*k)*(1+Math.sin(t*12)*.08),1.2*(.4+.6*k));b.sp.material.opacity=.4+.4*k;
    if(Math.hypot(p.x-b.x,p.z-b.z)<90&&R()<.6)emit(b.x+(R()-.5)*1.2,b.y+.5,b.z+(R()-.5)*1.2,1,{c:pick([0xff7a2a,0xffb040,0xffd060]),dir:[0,1,0],spread:.25,sp:3+k*2,life:.8,s:.8*k+.3});}
  for(const f of anim.bfires)if(Math.hypot(f.x-p.x,f.z-p.z)<80&&R()<.35)emit(f.x+(R()-.5)*.3,f.y,f.z+(R()-.5)*.3,1,{c:pick([0x9fe3ff,0xdff4ff]),dir:[0,1,0],spread:.2,sp:2,life:.7,s:.5});
  if(anim.mirror)anim.mirror.rune.rotation.z-=dt*.2;if(anim.portal3)anim.portal3.rune.rotation.z+=dt*.4;
  if(G.inW3){for(let k=0;k<3;k++){const a=R()*TAU,r=R()*34;emit(camera.position.x+Math.cos(a)*r,camera.position.y+8+R()*10,camera.position.z+Math.sin(a)*r,1,{c:0xffffff,dir:[.25,-1,.12],spread:.25,sp:2.2,life:4.5,s:.24+R()*.2,drag:1});}}

  if(G.solo&&(G.state==='play'||G.state==='cut'))updTrial(dt);

function chapterEnd3(){const k=G.c3.ending;$('#endSub').textContent='第三章 完 ── 白夜の誓い';$('#endTitle').textContent=k===1?'DAWN OF THE NORTH':'OATH OF FOUR';
  $('#endText').textContent=k===1?'誓約は解き放たれ、三百年の冬が終わった。凍てついた都に、はじめての夕陽が沈む。目を覚ました人々の中で、ルミナはただの少女として泣き、笑った。白き騎士は雪となって、静かに空へ還っていった。── 光の誓約に守られた時代は終わり、人は自らの足で歩きはじめる。'
    :'誓約は、四人の心に紡ぎ直された。白夜は明け、氷都は穏やかな眠りの中で光をたたえている。ルミナは微笑んで眠りにつき、騎士アストレアは雪の民の守り手として北の地に残った。── 誓いは、ひとりで背負うものではない。セレスはそっと、仲間の手を握った。';
  $('#bEnd').textContent='冒険を続ける';
  endCb=()=>{setMain(18);if(k===1)toast('ルミナの祝福：奥義ゲージの上昇量とMP回復量が1.5倍になった','gold');else toast('四人の誓い：仲間全員の能力が永続的に10%上昇した','gold');};}

// ================================================================ loop
const clock=new THREE.Clock();let hudT=0,autoT=0,labelT=0;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();pMat.uniforms.scale.value=h*renderer.getPixelRatio()/2/Math.tan(THREE.MathUtils.degToRad(camera.fov/2));}
addEventListener('resize',resize);
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05);G.t+=dt;
  const active=G.state==='play';
  if(active||G.state==='cut'){
    updLaters(dt);G.buff.atk=Math.max(0,G.buff.atk-dt);G.buff.haste=Math.max(0,G.buff.haste-dt);
    let gdt=dt;if(G.hitStop>0){G.hitStop-=dt;gdt=dt*.12;}
    for(const m of party)updDot(m,gdt);
    updPlayer(gdt);comps.forEach((c,i)=>updComp(c,i,gdt));
    for(let i=enemies.length-1;i>=0;i--)if(enemies[i])updEnemy(enemies[i],gdt);
    updProjs(gdt);updTeles(gdt);updSpawns(dt);updBossSpawns();
    interactTarget=findInteract();const pr=$('#prompt');
    if(interactTarget&&active){pr.hidden=false;pr.innerHTML=`<span class="kbd">E</span><span></span>`;pr.lastChild.textContent=interactTarget.label;}else pr.hidden=true;
    {const it=active?interactTarget:null;pr.classList.toggle('hot',!!it);TB.use.classList.toggle('hot',!!it);TB.use.textContent=it?({npc:'話す',shard:'拾う',portal:'転移',portal2:'転移',return:'帰還',portal3:'転移',echo:'触れる',letter:'拾う',trial:'挑む',pillar:'触れる',inscr:'読む',crystal:'触れる'}[it.k]||'調べる'):'調べる';
      if(it){const tp=it.o?it.o.pos:it.k==='portal'?{x:anim.portal.x,y:CAP.h,z:anim.portal.z}:it.k==='portal2'?{x:anim.portal2.x,y:T2.h,z:anim.portal2.z}:{x:anim.skyPortal.x,y:SKY.y+1.5,z:anim.skyPortal.z};
        intMark.visible=true;intMark.position.set(tp.x,(tp.y||0)+(it.k==='npc'?2.75:2.3)+Math.sin(G.t*6)*.15,tp.z);intMark.rotation.y+=dt*3;}else intMark.visible=false;}
    autoT+=dt;if(autoT>60){autoT=0;saveGame(true);}
  }else if(G.state==='dialog'||G.state==='panel'||G.state==='map'||G.state==='dead'||G.state==='ending'){
    $('#prompt').hidden=true;
    for(const n of npcs){animHumanoid(n.model,n.animT+=dt,0,{bob:true});}
    if(G.state!=='dead'){for(const m of party)if(m.alive){animHumanoid(m.model,m.animT+=dt,0,{bob:true});}}
  }
  if(active)for(const n of npcs){n.animT+=dt;const dn=d2(n.pos,player.pos);n.model.g.visible=dn<170&&npcOn(n);if(dn>170)continue;const want=dn<6?Math.atan2(player.pos.x-n.pos.x,player.pos.z-n.pos.z):n.baseRot;n.rotY=turn(n.rotY,want,dt*3);n.model.g.rotation.y=n.rotY;animHumanoid(n.model,n.animT,0,{bob:true});}
  dialogTick(dt);updC3(dt);updMode(dt);updEnv(dt);updHeroFx(dt);updParticles(dt);updCamera(dt);
  if(G.state!=='title'&&G.state!=='boot'){
    hudT-=dt;if(hudT<=0){hudT=.1;updateHUD();}
    drawMinimap();
    for(const f of floaters){if(f.t<=0)continue;f.t-=dt;f.p.y+=f.vy*dt;f.vy*=.94;const s=toScreen(f.p);if(!s||f.t<=0){f.e.hidden=true;continue;}f.e.style.left=s.x+'px';f.e.style.top=s.y+'px';f.e.style.opacity=Math.min(1,f.t*2.5);}
    let bi=0;for(const e of enemies){if(bi>=ebars.length)break;if(e.dead||e.world!==curWorld()||e.boss&&G.bossActive)continue;if(e.barT<=0&&G.focus!==e)continue;if(d2(e.pos,player.pos)>60)continue;
      const s=toScreen(e.pos,(e.fly||0)+e.rad*2+.6);if(!s)continue;const el=ebars[bi++];el.hidden=false;el.style.left=s.x+'px';el.style.top=s.y+'px';el.firstChild.textContent=`Lv${e.lv} ${e.name}`;el.querySelector('i').style.transform=`scaleX(${Math.max(0,e.hp/e.maxHp)})`;}
    for(;bi<ebars.length;bi++)ebars[bi].hidden=true;
    let ni=0;if(!G.inSky)for(const n of npcs){if(ni>=nlabels.length)break;if(!npcOn(n))continue;if(d2(n.pos,player.pos)>16)continue;const s=toScreen(n.pos,2.35);if(!s)continue;const el=nlabels[ni++];el.hidden=false;el.style.left=s.x+'px';el.style.top=s.y+'px';el.innerHTML='';el.appendChild(document.createTextNode(n.name));if(n.title){const sm=document.createElement('small');sm.textContent=n.title;el.appendChild(sm);}}
    for(;ni<nlabels.length;ni++)nlabels[ni].hidden=true;
    if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('#banner').classList.remove('on');}
  }
  renderer.render(scene,camera);
}

// ================================================================ boot
function start(data){
  resize();
  placeParty(VIL.x+22,VIL.z-26,0);
  buildNPCs();
  const snd=lsGet('lo-sound');if(snd==='0')setSound(false);
  if(lsGet(SAVE_KEY))$('#bCont').disabled=false;
  $('#loading').hidden=true;
  // pre-populate some enemies for the title flyover
  for(const z of ZONES){if(Math.hypot(z.x-player.pos.x,z.z-player.pos.z)>400)continue;for(let i=0;i<Math.ceil(z.max/2);i++)spawnInZone(z,false);}
  if(data&&data.save){try{applySave(data.save);beginPlay(false);}catch(e){G.state='title';$('#title').hidden=false;}}
  else{G.state='title';$('#title').hidden=false;}
  try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({save:(G.state==='title'||G.state==='boot'||G.state==='intro')?null:snapshot()}));}catch(e){}
  frame();
}
setTimeout(()=>{try{const h=window.claude&&window.claude.hot;if(h&&h.ready)h.ready(start);else start((h&&h.data)||{});}catch(e){start({});}},30);
})();
