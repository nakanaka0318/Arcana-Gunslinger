<title>むすび相談所</title>
<meta name="description" content="依頼人の条件に合う相手を探し、お見合いを成功に導く結婚相談所シミュレーション">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f1eff4; --surface:#fbfafc; --surface2:#e9e5ef; --ink:#1d1b2e; --muted:#676280; --line:#d8d3e2;
  --ai:#2b3a67; --on-ai:#ffffff; --beni:#c23b5a; --kin:#9c7a2a; --ok:#2c7a57; --ng:#b8453a;
  --shadow:0 1px 2px rgba(29,27,46,.06),0 10px 28px rgba(29,27,46,.07);
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#14131d; --surface:#1d1b29; --surface2:#282538; --ink:#ece9f5; --muted:#a39eb8; --line:#363150;
    --ai:#9fb2ec; --on-ai:#14131d; --beni:#f27b97; --kin:#dcb866; --ok:#62c598; --ng:#f08472;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14131d; --surface:#1d1b29; --surface2:#282538; --ink:#ece9f5; --muted:#a39eb8; --line:#363150;
  --ai:#9fb2ec; --on-ai:#14131d; --beni:#f27b97; --kin:#dcb866; --ok:#62c598; --ng:#f08472;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:0 48px}
.app{max-width:1040px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.pick:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--serif);font-weight:800;text-wrap:balance;margin:0;line-height:1.35}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:22px;letter-spacing:.06em}
.brand small{display:block;font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.2em;color:var(--muted)}
.rec{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.rec b{font-size:17px;color:var(--ink);font-family:var(--serif);margin-left:4px}
.rec .m b{color:var(--beni)}

/* stepper */
.steps{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.steps li{font-size:11.5px;color:var(--muted);border-top:3px solid var(--line);padding-top:6px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps li span{font-variant-numeric:tabular-nums;margin-right:4px}
.steps li.done{border-color:var(--ai);color:var(--ink)}
.steps li.now{border-color:var(--beni);color:var(--beni);font-weight:700}
@media (max-width:640px){.steps li:not(.now) b{display:none}.steps li{font-size:11px}}

/* layout */
.cols{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted);font-weight:700}
.lead{font-size:14px;color:var(--muted);margin:6px 0 0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 20px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--ai)}
.btn.primary{background:var(--ai);color:var(--on-ai);border-color:var(--ai)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.beni{background:var(--beni);border-color:var(--beni);color:#fff}

/* karte */
.karte h2{font-size:21px}
.karte .who{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.face{flex:none;border-radius:50%;background:var(--surface2);overflow:hidden}
.face svg{display:block;width:100%;height:100%}
.meta{font-size:12.5px;color:var(--muted)}
.stats{display:grid;grid-template-columns:auto 1fr 30px;gap:6px 10px;align-items:center;font-size:13px}
.bar{height:7px;border-radius:4px;background:var(--surface2);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ai);border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.stats .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.delta{font-size:11px;font-weight:700;margin-left:4px}
.up{color:var(--ok)} .dn{color:var(--ng)}
.sub{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.sub h4{margin:0 0 8px;font-size:11px;letter-spacing:.16em;color:var(--muted)}
.hid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:var(--surface)}
.chip.q{color:var(--muted)}
.cond{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:8px 10px;border-radius:8px;background:var(--surface2);margin-bottom:6px}
.cond s{color:var(--muted);font-weight:400;font-size:12px}
.cond .tag{font-size:10.5px;letter-spacing:.1em;color:var(--beni);border:1px solid var(--beni);border-radius:4px;padding:0 5px}
.cond.dropped{opacity:.55;text-decoration:line-through}

/* step 0-1 */
.quote{font-family:var(--serif);font-size:19px;line-height:1.8;margin:14px 0;padding-left:16px;border-left:3px solid var(--beni)}
.condbig{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.condbig div{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface2)}
.condbig b{display:block;font-family:var(--serif);font-size:24px}
.condbig p{margin:6px 0 0;font-size:13px;color:var(--muted)}

/* training */
.weeks{display:flex;gap:6px;align-items:center}
.weeks i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.weeks i.done{background:var(--ai)} .weeks i.now{background:var(--beni)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.acts{grid-template-columns:1fr}}
.act{text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px;transition:border-color .2s,transform .2s}
.act:hover:not([disabled]){border-color:var(--ai);transform:translateY(-2px)}
.act[disabled]{cursor:default}
.act h3{font-size:16px}
.act p{margin:0;font-size:12.5px;color:var(--muted)}
.act .eff{font-size:13px;font-weight:700;color:var(--ai)}
.act .risk{font-size:11.5px;color:var(--ng)}
.gauge{position:relative;height:10px;border-radius:5px;background:color-mix(in srgb,var(--ng) 22%,var(--surface2));overflow:visible;margin-top:auto}
.gauge .ok{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--ok) 55%,var(--surface2));border-radius:5px 0 0 5px}
.gauge .mk{position:absolute;top:-4px;width:3px;height:18px;background:var(--ink);border-radius:2px;left:0;transition:left 1s cubic-bezier(.15,.9,.25,1)}
.prob{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.prob b{color:var(--ink);font-variant-numeric:tabular-nums}
.act.sel{border-color:var(--beni);box-shadow:0 0 0 2px color-mix(in srgb,var(--beni) 30%,transparent)}
.verdict{font-family:var(--serif);font-weight:800;font-size:18px}
.tlog{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.tlog li{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.tlog .w{color:var(--muted);font-variant-numeric:tabular-nums}

/* candidates */
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.pick{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.pick:hover{border-color:var(--ai)}
.pick.on{border-color:var(--beni);box-shadow:0 0 0 2px color-mix(in srgb,var(--beni) 28%,transparent)}
.pick .hd{display:flex;gap:10px;align-items:center}
.pick .hd b{font-size:15px}
.pick .ck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff;flex:none}
.pick.on .ck{background:var(--beni);border-color:var(--beni)}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11px;color:var(--muted)}
.mini div b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.mini div b.hit{color:var(--ok)} .mini div b.miss{color:var(--ng)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.bdg{font-size:11.5px;border-radius:6px;padding:1px 7px;font-weight:700}
.bdg.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.bdg.ng{background:color-mix(in srgb,var(--ng) 14%,transparent);color:var(--ng)}
.sticky{position:sticky;bottom:12px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 18px;box-shadow:var(--shadow)}

/* eve */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.vs{grid-template-columns:1fr}}
.scale{position:relative;margin:34px 0 8px;height:14px;border-radius:7px;overflow:visible;display:flex}
.scale span{flex:1;height:100%}
.scale .pin{position:absolute;top:-28px;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap;text-align:center}
.scale .pin::after{content:"";display:block;width:2px;height:26px;margin:2px auto 0;background:currentColor}
.scale .gap{position:absolute;top:18px;height:10px;border:2px solid var(--beni);border-top:none;border-radius:0 0 4px 4px}
.pair{display:grid;grid-template-columns:70px 1fr 1fr;gap:6px 10px;align-items:center;font-size:13px}
.pair .bar i{background:var(--ai)} .pair .bar.p i{background:var(--beni)}
.notes{margin:0;padding-left:1.2em;font-size:13.5px}
.notes li{margin-bottom:4px}
.preps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:560px){.preps{grid-template-columns:1fr}}

/* ===== omiai ===== */
.om{display:flex;flex-direction:column;gap:10px}
.hud{display:grid;grid-template-columns:auto 1fr 1fr;gap:10px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px 20px}
@media (max-width:700px){.hud{grid-template-columns:1fr 1fr}.hud .clock{grid-column:1/-1}}
.clock{display:flex;align-items:baseline;gap:10px}
.clock b{font-family:var(--serif);font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock span{font-size:12px;color:var(--muted);letter-spacing:.1em}
.meter{font-size:11.5px;color:var(--muted);min-width:0}
.meter .l{display:flex;justify-content:space-between;gap:6px}
.meter .l b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.mbar{position:relative;height:10px;border-radius:5px;background:var(--surface2);margin-top:3px}
.mbar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:linear-gradient(90deg,#8c93b8,var(--beni));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.mbar .tk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35}
.mbar .tk em{position:absolute;top:13px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9.5px;white-space:nowrap;opacity:1}
.meter .fl{position:relative}
.pop{position:absolute;right:30px;top:0;font-weight:800;font-size:13px;animation:pop 1.3s ease-out forwards;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:16px;background:#e9e1d0;border:1px solid var(--line);user-select:none;cursor:pointer}
@media (max-width:640px){.stage{aspect-ratio:4/3}}
.stage .room{position:absolute;inset:0;width:100%;height:100%}
.air{position:absolute;inset:0;pointer-events:none;transition:background 1.2s ease;mix-blend-mode:multiply}
.seat{position:absolute;bottom:13%;width:29%;max-width:270px;aspect-ratio:120/140;transition:transform .35s ease,filter .35s ease}
.seat.c{left:7%} .seat.p{right:7%}
.seat.p svg{transform:scaleX(-1)}
.seat svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 10px rgba(60,40,20,.18))}
.seat.dim{filter:brightness(.93) saturate(.85)}
.seat.speak{transform:translateY(-3%) scale(1.03)}
.seat .fl2{position:absolute;left:50%;top:6%;transform:translateX(-50%)}
.seat .fl2 .pop{position:static;display:block;font-size:clamp(14px,2.6vw,22px);font-family:var(--serif);text-shadow:0 1px 0 #fff,0 0 8px #fff}
.table{position:absolute;left:0;right:0;bottom:0;height:26%;width:100%}
.thought{position:absolute;top:5%;max-width:44%;background:rgba(255,255,255,.92);color:#2a2536;border:2px dashed #b9a6c9;border-radius:18px;padding:8px 14px;font-size:clamp(12px,1.8vw,15px);line-height:1.6;animation:fadein .35s ease;box-shadow:0 4px 14px rgba(60,40,80,.12)}
.thought.c{left:3%} .thought.p{right:3%}
.thought::after{content:"";position:absolute;bottom:-14px;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.92);border:2px dashed #b9a6c9}
.thought.c::after{left:22%} .thought.p::after{right:22%}
.thought small{display:block;font-size:10px;letter-spacing:.14em;color:#8a7a9a;font-weight:700}
.sfx{position:absolute;top:13%;left:50%;transform:translateX(-50%);font-family:var(--serif);font-weight:800;font-size:clamp(22px,5vw,46px);color:#5a3f2c;letter-spacing:.2em;text-shadow:0 2px 0 rgba(255,255,255,.8);animation:sfx 1.8s ease-out forwards;pointer-events:none;white-space:nowrap}
@keyframes sfx{0%{opacity:0;transform:translate(-50%,8px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}
.tube{transform-box:view-box;transform-origin:503px 214px;transition:transform .25s ease-in}
.kakon .tube{animation:tip 1.4s ease-in-out}
@keyframes tip{0%{transform:rotate(0)}30%{transform:rotate(-14deg)}38%{transform:rotate(16deg)}60%{transform:rotate(16deg)}100%{transform:rotate(0)}}
.banner{position:absolute;left:0;right:0;top:40%;text-align:center;background:rgba(29,27,46,.78);color:#fff;padding:10px;font-family:var(--serif);font-size:clamp(16px,3vw,26px);letter-spacing:.2em;animation:band .5s ease}
.banner small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.3em;opacity:.75}
@keyframes band{from{clip-path:inset(0 50% 0 50%)}to{clip-path:inset(0 0 0 0)}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.box{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px 14px;min-height:150px;cursor:pointer;box-shadow:var(--shadow)}
.plate{position:absolute;top:-13px;left:16px;background:var(--ai);color:var(--on-ai);font-weight:700;font-size:13px;padding:2px 14px;border-radius:6px;letter-spacing:.05em}
.plate.p{background:var(--beni);color:#fff}
.plate.m{background:var(--kin);color:#fff}
.plate.th{background:var(--surface);color:var(--muted);border:1px dashed var(--muted)}
.say{font-size:17px;line-height:1.85;min-height:3.7em;white-space:pre-wrap}
.say.n{color:var(--muted);font-family:var(--serif);font-size:16px}
.say.th{color:var(--muted);font-style:normal}
.why{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;min-height:24px}
.why .bdg{font-weight:500}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.ctl .row{gap:6px}
.ctl .btn{padding:5px 14px;font-size:12.5px}
.ctl .btn.on{background:var(--surface2);border-color:var(--ai)}
.next{font-size:12px;color:var(--muted);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.choice h3{font-size:18px}
.chs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
@media (max-width:640px){.chs{grid-template-columns:1fr}}
.chs button{text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface2);display:flex;flex-direction:column;gap:4px}
.chs button:hover{border-color:var(--kin)}
.chs b{font-size:15px}
.chs span{font-size:12px;color:var(--muted)}
.logp{max-height:260px;overflow:auto;font-size:13px;border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.logp p{margin:0 0 4px}
.logp .nm{font-weight:700;margin-right:6px}

/* result */
.result{text-align:center;padding-block:28px}
.stamp{width:180px;height:180px;margin:10px auto 16px;border-radius:50%;border:7px double var(--beni);color:var(--beni);display:grid;place-items:center;font-family:var(--serif);font-weight:800;font-size:40px;letter-spacing:.08em;transform:rotate(-12deg);animation:stamp .55s cubic-bezier(.3,1.6,.5,1) both}
.stamp.sm{font-size:30px}
.stamp.gray{border-color:var(--muted);color:var(--muted)}
@keyframes stamp{from{opacity:0;transform:rotate(-12deg) scale(2.2)}to{opacity:1;transform:rotate(-12deg) scale(1)}}
.epi{font-family:var(--serif);font-size:17px;max-width:34em;margin:0 auto 18px;line-height:1.9}
.moments{text-align:left;max-width:560px;margin:0 auto;list-style:none;padding:0;font-size:13.5px}
.moments li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.finals{display:flex;justify-content:center;gap:28px;margin:10px 0 20px;flex-wrap:wrap}
.finals div{font-size:12px;color:var(--muted)}
.finals b{display:block;font-family:var(--serif);font-size:30px;color:var(--ink);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M4 22 C12 22 14 10 20 10 C26 10 28 22 36 22" stroke="var(--beni)"/><path d="M4 26 C12 26 14 14 20 14 C26 14 28 26 36 26" stroke="var(--kin)"/><circle cx="20" cy="22" r="5" stroke="var(--beni)"/></g></svg>
      <div><h1>むすび相談所</h1><small>縁結び・お見合い仲介</small></div>
    </div>
    <div class="rec" id="rec"></div>
  </header>
  <ol class="steps" id="steps"></ol>
  <main id="main"></main>
</div>

<script>
(()=>{
const R=Math.random, ri=(a,b)=>Math.floor(R()*(b-a+1))+a, pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=(m,s)=>m+(R()+R()+R()-1.5)*s*2;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s);

const SL={age:'年齢',trust:'信用',asset:'資産',edu:'学力',charm:'魅力'};
const HL={topic:'話題',care:'気配り',humor:'ユーモア',nerve:'度胸'};
const LB={...SL,...HL};
const VIS=['trust','asset','edu','charm'];
const HID=['topic','care','humor','nerve'];
const STEPS=['来訪','条件','研鑽','探索','打診','前日','お見合い','結果'];

function genPerson(g,o={}){
  const job=pick(JOBS);
  const p={id:Math.random().toString(36).slice(2,9),g,name:pick(SUR)+' '+pick(g==='m'?MG:FG),age:o.age??ri(25,46),job:job.n,jobTalk:job.t};
  for(const k of VIS)p[k]=clamp(Math.round(norm(46,13)+(job.b[k]||0)),5,97);
  p.asset=clamp(p.asset+Math.round((p.age-32)*0.8),5,97);
  p.topic=ri(2,98);
  for(const k of ['care','humor','nerve'])p[k]=clamp(Math.round(norm(50,18)),4,96);
  p.look={skin:pick(SKIN),hair:p.age>45&&R()<.6?'#8d8680':pick(HAIR),style:g==='m'?pick([0,1]):pick([2,3,2,1]),cloth:pick(CLOTH),glasses:p.edu>70&&R()<.55};
  return p;
}

function genClientConds(c){
  return shuffle(['trust','asset','edu','charm','age']).slice(0,2).map(stat=>{
    const val=stat==='age'?Math.max(26,c.age+ri(-1,4)):ri(11,15)*5;
    return {stat,val,orig:val};
  });
}
function genCandConds(C){
  return shuffle(['trust','asset','edu','charm','age']).slice(0,2).map(stat=>({stat,val:stat==='age'?Math.max(27,C.age+ri(-3,5)):ri(8,15)*5}));
}

function lowered(c,kind){return c.stat==='age'?c.val+(kind==='small'?2:5):Math.max(0,c.val-(kind==='small'?5:15));}
function effText(o){
  if(o.cond){const c=S.conds[o.ci];return o.cond==='drop'?`「${condText(c)}」を撤回`:`「${condText(c)}」→ ${c.stat==='age'?lowered(c,o.cond)+'歳以下':lowered(c,o.cond)+'以上'}`;}
  return Object.entries(o.e).map(([k,v])=>`${LB[k]} ${v>0?'+':''}${v}${HID.includes(k)?'（隠し）':''}`).join('、');
}
function genOffers(){
  const act=S.conds.map((c,i)=>i).filter(i=>!S.conds[i].dropped);
  const out=[];
  for(const a of shuffle(ACTIONS)){
    if(out.length>=3)break;
    if(a.cond&&(!act.length||out.some(o=>o.cond)))continue;
    out.push({...a,ci:a.cond?pick(act):null});
  }
  return out;
}

function genCands(){

  const arr=Array.from({length:10},()=>genPerson(g,{age:clamp(C.age+ri(-7,7),24,52)}));
  const orig=S.conds.map(c=>({stat:c.stat,val:c.orig}));
  const mo=p=>orig.every(c=>meets(p,c));
  let n=arr.filter(mo).length;
  for(const p of shuffle(arr)){
    if(n>=2)break;if(mo(p))continue;
    for(const c of orig){if(c.stat==='age')p.age=Math.min(p.age,c.val-ri(0,3));else p[c.stat]=Math.max(p[c.stat],clamp(c.val+ri(0,12),0,98));}

  arr.forEach(p=>p.conds=genCandConds(C));
  return arr;
}

  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe0e8"/><stop offset="1" stop-color="#f1efe0"/></linearGradient>
  <linearGradient id="wl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe6d3"/><stop offset="1" stop-color="#e2d5bc"/></linearGradient></defs>
  <rect width="800" height="450" fill="url(#wl)"/>
  <rect width="800" height="24" fill="#6b4a33"/>
  ${lat}
  <rect x="226" y="46" width="348" height="248" fill="#5a3f2c"/>

  <path d="M236 200 Q300 160 360 188 Q420 150 480 182 Q530 162 564 176 L564 284 L236 284Z" fill="#a3bc93"/>

  <ellipse cx="413" cy="156" rx="34" ry="24" fill="#cc6a50" opacity=".92"/><ellipse cx="398" cy="166" rx="18" ry="12" fill="#d98260"/>
  <ellipse cx="392" cy="258" rx="118" ry="16" fill="#8fb3bd"/><ellipse cx="370" cy="254" rx="40" ry="4" fill="#b8d3d8"/>
  <ellipse cx="292" cy="262" rx="15" ry="6" fill="#a3a19a"/><ellipse cx="318" cy="268" rx="9" ry="4" fill="#8f8d86"/>
  <g id="shishi">
    <rect x="490" y="208" width="4" height="52" fill="#6f5f34"/><rect x="514" y="208" width="4" height="52" fill="#6f5f34"/>
    <path d="M530 196 L532 238" stroke="#7d8a4a" stroke-width="5"/>
    <g class="tube"><path d="M468 208 L542 220 L540 229 L466 217Z" fill="#b8b46a"/><ellipse cx="467" cy="212.5" rx="2.5" ry="4.5" fill="#7b7a3c"/></g>

  <rect y="294" width="800" height="9" fill="#6b4a33"/>

}

  const cup=x=>`<ellipse cx="${x}" cy="62" rx="36" ry="9" fill="#f4f1ea"/><ellipse cx="${x}" cy="60" rx="36" ry="9" fill="none" stroke="#c9b48a" stroke-width="1.5"/>
   <path d="M${x-20} 36 L${x-16} 58 Q${x} 64 ${x+16} 58 L${x+20} 36Z" fill="#fbfaf6" stroke="#d8cdb6"/><ellipse cx="${x}" cy="36" rx="20" ry="5" fill="#9a5a2c"/>

/* ---------- result ---------- */
function finishOmiai(){
  const o=S.om,a=o.pImp,b=o.cImp;
  const kind=a>=82&&b>=82?'m':a>=55&&b>=55?'c':'f';
  S.result={kind,pImp:a,cImp:b};
  S.rec[kind]++;saveRec();S.step=7;render();window.scrollTo({top:0});
}
function renderResult(){
  const C=S.client,P=partner(),r=S.result,o=S.om;
  const who=r.pImp<55&&r.cImp<55?'双方から':r.pImp<55?`${P.name}さんの側から`:`依頼人の${nm(C)}から`;
  const epi=r.kind==='m'?`三か月後。相談所に一通の封筒が届いた。中に入っていたのは、${C.name}さんと${P.name}さんの結婚式の招待状だった。`
   :r.kind==='c'?`翌朝、双方から「ぜひ、またお会いしたい」と連絡が入った。${sur(C)}さんと${sur(P)}さん、二人の交際が始まる。`
   :`翌日、${who}「今回はご縁がなかったということで」と連絡が入った。`;
  const ms=o.moments.slice().sort((x,y)=>Math.abs(y.dp)+Math.abs(y.dc)-Math.abs(x.dp)-Math.abs(x.dc)).slice(0,6);
  main.innerHTML=`<section class="panel result">
    <div class="eyebrow">STEP 8 ─ お見合いの結果</div>
    <div class="stamp ${r.kind==='c'?'sm':''} ${r.kind==='f'?'gray':''}">${r.kind==='m'?'成婚':r.kind==='c'?'交際<br>成立':'お断り'}</div>
    <h2 style="font-size:28px">${r.kind==='m'?'大成功 ─ ご結婚':r.kind==='c'?'成功 ─ カップル成立':'不成立'}</h2>
    <div class="finals"><div>${sur(P)}さんの気持ち<b>${r.pImp}</b></div><div>${sur(C)}さんの気持ち<b>${r.cImp}</b></div></div>
    <p class="epi">${epi}</p>
    <div class="row" style="justify-content:center;gap:24px;margin-bottom:22px">${face(C,84,r.kind==='f'?'down':'joy')}${face(P,84,r.kind==='f'?'neutral':'joy')}</div>
    <h3 style="font-size:16px;margin-bottom:6px">勝負を分けた場面</h3>
    <ul class="moments">${ms.map(m=>`<li><span>${m.why||'—'}</span><span>${m.dp?`<span class="bdg ${m.dp>0?'ok':'ng'}">${sur(P)} ${m.dp>0?'+':''}${m.dp}</span> `:''}${m.dc?`<span class="bdg ${m.dc>0?'ok':'ng'}">${sur(C)} ${m.dc>0?'+':''}${m.dc}</span>`:''}</span></li>`).join('')}</ul>
    <p class="meta" style="margin-top:14px">判定：両者55以上で交際成立、両者82以上で成婚。</p>
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary" data-a="again">次の依頼人を迎える</button></div>
  </section>`;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;
  if(a==='toConds'){S.step=1;render();}
  else if(a==='toTrain'){S.step=2;render();}
  else if(a==='act')doAct(+t.dataset.i);
  else if(a==='toSearch'){S.cands=genCands();S.picked=[];S.flash={};S.step=3;render();}
  else if(a==='pick'){const id=t.dataset.id,i=S.picked.indexOf(id);if(i>=0)S.picked.splice(i,1);else if(S.picked.length<3)S.picked.push(id);render();}
  else if(a==='toShort'){S.partner=null;S.step=4;render();window.scrollTo({top:0});}
  else if(a==='choose'){S.partner=t.dataset.id;render();}
  else if(a==='back'){S.step=3;render();}
  else if(a==='toEve'){S.step=5;S.prep=null;render();window.scrollTo({top:0});}
  else if(a==='prep'){if(S.prep)return;const C=S.client,P=partner(),k=t.dataset.k;S.prep=k;
    if(k==='nerve')C.nerve=clamp(C.nerve+15,1,99);if(k==='charm')C.charm=clamp(C.charm+5,1,99);if(k==='care')C.care=clamp(C.care+10,1,99);
    if(k==='topic'){const d=P.topic-C.topic;C.topic+=Math.sign(d)*Math.min(12,Math.abs(d));}render();}
  else if(a==='toOmiai'){S.om={q:[],i:-1,ph:0,pImp:50,cImp:50,flags:{},log:[],moments:[],auto:false,fast:false,end:false};S.om.q=buildPhase(0);S.step=6;render();window.scrollTo({top:0});}
  else if(a==='auto'){S.om.auto=!S.om.auto;t.classList.toggle('on',S.om.auto);t.textContent='オート'+(S.om.auto?' ON':'');if(S.om.auto&&!typing)scheduleAuto();else clearTimeout(autoTimer);}
  else if(a==='fast'){S.om.fast=!S.om.fast;t.classList.toggle('on',S.om.fast);t.textContent='早送り'+(S.om.fast?' ON':'');if(S.om.fast){if(typing)finishType();else scheduleAuto();}else clearTimeout(autoTimer);}
  else if(a==='om-choice')pickChoice(t.dataset.k);
  else if(a==='toResult')finishOmiai();
  else if(a==='again'){newClient();render();window.scrollTo({top:0});}
});
document.addEventListener('keydown',e=>{
  if(S.step!==6||e.target.closest('button,summary'))return;
  if(e.key==='Enter'||e.key===' '){if(e.target.id==='stage')return;e.preventDefault();omNext();}
});

function boot(data){
  if(data&&data.S){S=data.S;S.rolling=null;}
  else{S={rec:loadRec()};newClient();}
  render();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
})();
</script>
